# Where the CDM register lives, and corrected locations for register links that no longer resolve.
# collect_cdms.py reads this file; SOURCES.json records what was used.
register:
  project: simpl/simpl-open/foundations/architecture
  ref: main
  path: cdm-register/cdm-index.md
overrides:
  # The register links to feature/S36-cdm-models, which no longer exists (17 Nov 2026).
  Contract Consumption BE:
    project: simpl/simpl-open/integration/resource-sharing/resource-sharing-runtime/resource-consumption/contract-consumption-adapter-be
    ref: feature/add-cdm
    path: documents/architecture/cdm/contract-consumption-be.md
  # Found by scan_cdms.py (17 Nov 2026): the register links to a branch or file name that does not exist.
  EDC Connector Adapter:
    project: simpl/simpl-open/integration/resource-sharing/resource-sharing-runtime/connector/edc-connector-adapter-be
    ref: feature/add-cdm
    path: documents/architecture/cdm/edcconnectoradapter.md
  Schema Sync Adapter:
    project: simpl/simpl-open/data/semantics-and-vocabulary/schema-management/schema-manager/schema-sync-adapter-be
    ref: feature/add-cdm
    path: documents/architecture/cdm/schema-sync-adapter.md
  SD Tooling BE:
    project: simpl/simpl-open/governance/resource-management/metadata-description/resource-description-tooling/sd-tooling-be
    ref: feature/add-cdm
    path: documents/architecture/cdm/sdtooling-api-be.md
  SD Validation BE:
    project: simpl/simpl-open/governance/resource-management/metadata-description/validation/validation-be
    ref: feature/add-cdm
    path: documents/architecture/cdm/sdtooling-validation-api-be.md
  Search Client BE:
    project: simpl/simpl-open/integration/resource-discovery/search-engine/catalogue-search/catalogue-client-be
    ref: feature/add-cdm
    path: documents/architecture/cdm/xfsc-advsearch-be.md
  Identity Provider BE:
    project: simpl/simpl-open/security/access-control-and-trust/identity-provider-federation/identity-provider/identity-provider-be
    ref: main
    path: documents/architecture/cdm/identity-provider-cdm.md   # the register says identity-provider-cmd.md
extra:
  # CDMs in the repositories that the register does not list (scan_cdms.py, 17 Nov 2026).
  Infrastructure BE:
    project: simpl/simpl-open/infrastructure/provisioning/infrastructure-provisioning/infrastructure-provisioning/infrastructure-be
    ref: main
    path: documents/architecture/cdm/infrastructure-be-cdm.md
  Schema Default Properties:
    project: simpl/simpl-open/data/semantics-and-vocabulary/schema-management/schema-manager/schema-manager-be
    ref: main
    path: documents/architecture/cdm/schema-default-properties-dm.md
    file: schema-manager-be-default-properties.md
  Policy Manager BE:
    project: simpl/simpl-open/governance/policy-management/policy-manager-be
    ref: main
    path: openapi/cdm.yaml
