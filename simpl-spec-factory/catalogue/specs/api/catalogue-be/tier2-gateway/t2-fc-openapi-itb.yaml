tags:
- name: SelfDescriptions
  description: Retrieving Self-Descriptions from the Catalogue. All Self-Descriptions are JSON-LD files. They are referenced
    by their sha256 hash. Catalogues synchronize by downloading changesets (lists of hashes) from known other Catalogues and
    reading the full Self-Descriptions of entries that are unknown to them.
  externalDocs:
    description: Find out more
    url: http://gaiax.io
- name: Query
  description: Send graph queries to this Catalogue.
- name: Schemas
  description: The format of the self-descriptions are defined by schemas in the catalogue. Here you get information about
    the latest schema.
- name: Verification
  description: The Catalogue provides a verification service for e.g. checking the syntax
- name: Session
  description: Management for auth sessions in the catalogue
- name: Webhooks
  description: Inbound webhooks for schema lifecycle events from the Schema Manager
paths:
  /selfDescriptions/quickSearch:
    get:
      tags:
      - SelfDescriptions
      operationId: selfDescriptionsQuickSearchGet
      summary: Quick search active Resource Descriptions.
      description: |-
        Quick search active Resource Descriptions.

        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      parameters:
      - name: searchTerm
        in: query
        required: true
        schema:
          type: string
      - name: minimumScore
        in: query
        required: false
        schema:
          type: number
          format: double
        description: Optional. Minimum overall quality score. Must be >= 0.
      - name: minimumClassification
        in: query
        required: false
        schema:
          type: string
        description: Optional. Minimum overall quality classification from the active MQP.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: User-Attributes
        in: header
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Search response with active Resource Description quality summary fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponsePayload'
              example:
                totalCount: 2
                items:
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                      offeringType: infrastructure
                      name: text title for infrastructure resource.
                      inLanguage: da
                      description: text description
                      serviceAccessPoint: http://serviceaccesspoint.com
                      overallScore: 0.92
                      overallClassification: Green
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                      offeringType: data
                      name: asset 004
                      description: asset description
                      inLanguage: en
                      serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                      overallScore: null
                      overallClassification: null
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnBadRequestInvalidMinimumScore:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumScore must be greater than or equal to 0.
                returnBadRequestInvalidMinimumClassification:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumClassification is not a supported quality classification value.
        '500':
          $ref: '#/components/responses/ServerError'
  /selfDescriptions/advancedSearch:
    post:
      tags:
      - SelfDescriptions
      operationId: selfDescriptionsAdvancedSearchPost
      summary: Advanced search active Resource Descriptions.
      description: |-
        Advanced search active Resource Descriptions.

        Optional root fields minimumScore (>= 0) and minimumClassification may be included to filter by quality assessment results.

        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      parameters:
      - name: User-Attributes
        in: header
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
            examples:
              returnValidResponse:
                value:
                  simpl:GeneralServiceProperties:
                    name: asset002
              returnValidResponseWithQualityFilters:
                value:
                  minimumScore: 75
                  minimumClassification: good
                  simpl:GeneralServiceProperties:
                    name: asset002
      responses:
        '200':
          description: Search response with active Resource Description quality summary fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponsePayload'
              example:
                totalCount: 2
                items:
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                      offeringType: infrastructure
                      name: text title for infrastructure resource.
                      inLanguage: da
                      description: text description
                      serviceAccessPoint: http://serviceaccesspoint.com
                      overallScore: 0.92
                      overallClassification: Green
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                      offeringType: data
                      name: asset 004
                      description: asset description
                      inLanguage: en
                      serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                      overallScore: null
                      overallClassification: null
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnBadRequestInvalidMinimumScore:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumScore must be greater than or equal to 0.
                returnBadRequestInvalidMinimumClassification:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumClassification is not a supported quality classification value.
        '500':
          $ref: '#/components/responses/ServerError'
  /selfDescriptions:
    get:
      tags:
      - SelfDescriptions
      summary: Get the list of metadata of Self-Descriptions in the Catalogue
      description: |-
        Get the list of metadata of Self-Descriptions in the Catalogue.

        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      operationId: readSelfDescriptions
      parameters:
      - name: uploadTimerange
        in: query
        description: Filter for the time range when the Self-Description was uploaded to the catalogue. The time range has
          to be specified as start time and end time as ISO8601 timestamp separated by a `/`.
        required: false
        example: 2022-03-01T13:00:00Z/2022-05-11T15:30:00Z
        schema:
          type: string
      - name: statusTimerange
        in: query
        description: Filter for the time range when the status of the Self-Description was last changed in the catalogue.
          The time range has to be specified as start time and end time as ISO8601 timestamp separated by a `/`.
        required: false
        example: 2022-03-01T13:00:00Z/2022-05-11T15:30:00Z
        schema:
          type: string
      - name: issuer
        in: query
        description: Filter for the issuer of the Self-Description. This is the unique ID of the Participant that has prepared
          the Self-Description.
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
      - name: validatorDids
        in: query
        description: Filter for a validator of the Self-Description. This is the unique ID of the Participant that validated
          (part of) the Self-Description.
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
      - name: status
        in: query
        description: Filter for the status of the Self-Description.
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SelfDescriptionStatus'
        explode: false
      - name: id
        in: query
        description: Filter for a id/credentialSubject of the Self-Description.
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
      - name: sdHash
        in: query
        description: Filter for a hash of the Self-Description.
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
      - name: providedBy
        in: query
        description: Filter for Self-Descriptions by provider identifier from the providedBy field.
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
      - name: withMeta
        in: query
        description: To add Self-Description Metadata to response or not.
        required: false
        schema:
          type: boolean
          default: true
      - name: withContent
        in: query
        description: To add Self-Description Content to response or not.
        required: false
        schema:
          type: boolean
          default: false
      - name: offset
        in: query
        required: false
        description: The number of items to skip before starting to collect the result set.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        description: The number of items to return.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: List of meta data of available Self-Descriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfDescriptions'
              example:
                totalCount: 1
                items:
                - meta:
                    sdHash: a3f8b2c1d4e5f67890abcdef1234567890abcdef1234567890abcdef12345678
                    id: did:web:registry.simpl-europe.eu:Participant:ExampleCompany
                    status: active
                    issuer: did:web:registry.simpl-europe.eu:Participant:ExampleCompany
                    validatorDids:
                    - did:web:registry.simpl-europe.eu:Participant:ValidatorOrg
                    uploadDatetime: '2024-01-15T10:30:00Z'
                    statusDatetime: '2024-01-15T10:30:00Z'
                  content: '{"@context": "https://www.w3.org/2018/credentials/v1", "@type": "VerifiableCredential"}'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's proactive
                  negotiation headers.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    post:
      tags:
      - SelfDescriptions
      summary: Add a new Service-Offering SelfDescription to the catalogue
      description: |-
        Add a new Service-Offering SelfDescription to the catalogue.

        **Required ABAC roles (any one of):** `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      operationId: addSelfDescription
      requestBody:
        description: The new SelfDescription
        content:
          application/json:
            schema:
              type: string
            example: '{"@context": ["https://www.w3.org/2018/credentials/v1", "https://w3id.org/security/suites/jws-2020/v1"],
              "@type": "VerifiableCredential", "issuer": "did:web:registry.simpl-europe.eu:Participant:ExampleCompany", "credentialSubject":
              {"@id": "did:web:registry.simpl-europe.eu:DataOffering:example-offering-001", "@type": "simpl:DataOffering",
              "simpl:name": "Example Data Offering"}}'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the added Self-Description.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfDescriptionPublicationResponse'
              example:
                sdHash: a3f8b2c1d4e5f67890abcdef1234567890abcdef1234567890abcdef12345678
                id: did:web:registry.simpl-europe.eu:Participant:ExampleCompany
                status: active
                issuer: did:web:registry.simpl-europe.eu:Participant:ExampleCompany
                validatorDids:
                - did:web:registry.simpl-europe.eu:Participant:ValidatorOrg
                uploadDatetime: '2024-01-15T10:30:00Z'
                statusDatetime: '2024-01-15T10:30:00Z'
                qualityAssessment:
                  rules:
                  - id: urn:rule:completeness
                    name: Completeness required fields
                    status: PASSED
                  - id: urn:rule:accuracy
                    name: Accuracy mandatory checks
                    status: FAILED
                  dimensions:
                  - name: Completeness
                    score: 0.91
                    classification: Green
                    thresholdStatus: PASSED
                  - name: Accuracy
                    score: 0.64
                    classification: Red
                  overall:
                    score: 0.78
                    classification: Yellow
                    thresholdStatus: PASSED
        '202':
          description: The request was accepted but the validation is not finished yet.
          headers:
            Location:
              description: The URL of the status page.
              schema:
                type: string
            Retry-After:
              description: The delay the client have to wait before requesting the status page.
              schema:
                type: integer
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's proactive
                  negotiation headers.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:unsupportedMediaType
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/415
                title: Unsupported Media Type
                status: 415
                detail: Server refused to accept the request because the message content format is not supported.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
  /selfDescriptions/resource:
