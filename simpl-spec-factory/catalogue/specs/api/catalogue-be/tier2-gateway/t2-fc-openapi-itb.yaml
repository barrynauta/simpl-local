openapi: 3.0.2
security:
- jwt: []
info:
  title: Eclipse XFSC Federated Catalogue (Tier 1 Gateway) (Tier 2 Gateway)
  description: "This REST API allows to manage Self-Descriptions, Queries, Schemas and Sessions\
    \ related the            Catalogue.        It also provides an endpoint for receiving webhooks about schema lifecycle\
    \ events from the Schema Manager. \n## Authentication & Authorization      \nThis component is designed to work behind\
    \ the Tier 2 gateway which can ensure       that only authenticated and authorized requests reach the Catalogue.     \
    \   Therefore, the API itself does not implement authentication and authorization enforcement but relies on the Tier 2\
    \ gateway for this.\n\nSubset exposed via Tier 1 gateway. No FC service routes were present in the provided Tier 1 values.\n\
    \nSubset exposed via Tier 2 gateway for FC routes from provided values."
  license:
    name: European Union Public License (EUPL) 1.2
    url: https://interoperable-europe.ec.europa.eu/sites/default/files/custom-page/attachment/eupl_v1.2_en.pdf
  contact:
    name: Simpl Programme
    email: cnect-simpl@ec.europa.eu
    url: https://simpl-programme.ec.europa.eu/
  version: 1.0.0
servers:
- url: https://authority.be.authority01.sandbox-cat-dat.simpl-europe.eu/fc/v1
  description: Configurable server
