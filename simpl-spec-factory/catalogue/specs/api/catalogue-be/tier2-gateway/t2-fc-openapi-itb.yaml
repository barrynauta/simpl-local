  /selfDescriptions/{selfDescriptionId}:
    get:
      tags:
      - SelfDescriptions
      summary: Read a Self-Description by its id. This returns the content of the self-description.
      description: |-
        Returns a single Self-Description.

        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      operationId: readSelfDescriptionById
      parameters:
      - name: selfDescriptionId
        in: path
        description: id of the SelfDescription
        required: true
        schema:
          type: string
      responses:
        '200':
