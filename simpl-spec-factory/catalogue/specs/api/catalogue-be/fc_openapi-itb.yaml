      summary: 'Add a new Schema to the catalogue.'
      description: |-
        This endpoint accepts either an ontology (OWL file), shape (SHACL file) or controlled vocabulary (SKOS file), which is added to the schemas of the catalogue.

        **Required RBAC roles:** N/A
      operationId: addSchema
      x-simpl-roles: []
      requestBody:
        description: 'The file of the new schema. either an ontology (OWL file), shape (SHACL file) or controlled vocabulary (SKOS file).'
        content:
          application/rdf+xml:
            schema:
              type: string
              description: 'OWL file describing the ontology of the schema or SKOS file describing the controlled vocabulary.'
            example: |
              <?xml version="1.0"?>
              <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:owl="http://www.w3.org/2002/07/owl#">
                <owl:Ontology rdf:about="https://example.org/schemas/my-ontology"/>
              </rdf:RDF>
          application/ld+json:
            schema:
              type: string
              description: 'OWL or SHACL file describing the ontology.'
            example:
              "@context": "https://www.w3.org/ns/owl.jsonld"
              "@type": "owl:Ontology"
              "@id": "https://example.org/schemas/my-ontology"
          application/json:
            schema:
              type: string
              description: 'OWL or SHACL file describing the ontology.'
            example:
              "@context": "https://www.w3.org/ns/owl.jsonld"
              "@type": "owl:Ontology"
              "@id": "https://example.org/schemas/my-ontology"
          text/turtle:
            schema:
              type: string
              description: 'SHACL file describing the ontology of the schema.'
            example: |
              @prefix owl: <http://www.w3.org/2002/07/owl#> .
              @prefix sh: <http://www.w3.org/ns/shacl#> .
              @prefix ex: <https://example.org/> .
              ex:MyShape a sh:NodeShape ; sh:targetClass ex:MyClass .
        required: true
      responses:
        '201':
          description: 'Created'
          headers:
            Location:
              description: 'URL of the added Schema.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:unsupportedMediaType
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/415
                title: Unsupported Media Type
                status: 415
                detail: Server refused to accept the request because the message content format is not supported.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
