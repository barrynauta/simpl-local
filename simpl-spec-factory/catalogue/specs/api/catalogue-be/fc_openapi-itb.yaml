  /schemas/{schemaName}/recalcQualityScore:
    post:
      tags:
        - Schemas
      summary: Trigger quality score recalculation for a schema.
      description: |-
        Acknowledges a request to recalculate quality scores for all Resource Descriptions linked to the schema.

        **Required RBAC roles:** N/A
      operationId: triggerQualityScoreRecalculation
      x-simpl-roles: []
      parameters:
        - name: schemaName
          in: path
          description: Name of the schema whose linked Resource Descriptions must be rescored.
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 64
            pattern: '^[A-Z][A-Za-z0-9]{2,63}$'
      requestBody:
        description: Metadata Quality Profile version that triggered the recalculation.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profileVersion
              properties:
                profileVersion:
                  type: string
                profileId:
                  type: string
            example:
              profileVersion: 1.2.0
              profileId: urn:simpl:mqp:DataOfferingShape:1.2.0
      responses:
        '202':
          description: Recalculation request accepted for asynchronous processing.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - schemaName
                  - profileVersion
                  - estimatedResourceCount
                properties:
                  status:
                    type: string
                  schemaName:
                    type: string
                  profileVersion:
                    type: string
                  estimatedResourceCount:
                    type: integer
              example:
                status: ACCEPTED
                schemaName: DataOfferingShape
                profileVersion: 1.2.0
                estimatedResourceCount: 1250
        '400':
          description: Invalid schema name or request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:catalogue:invalidInput
                title: Invalid input
                status: 400
                detail: schemaName 'data offering shape' is invalid. Must be PascalCase alphanumeric, 3-64 characters.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The schema or its active Metadata Quality Profile was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                schemaNotFound:
                  value:
                    type: urn:problem-type:simpl:catalogue:schemaNotFound
                    title: Schema not found
                    status: 404
                    detail: Schema 'UnknownShape' could not be resolved.
                activeQualityProfileNotFound:
                  value:
                    type: urn:problem-type:simpl:catalogue:activeQualityProfileNotFound
                    title: Active quality profile not found
                    status: 404
                    detail: No active Metadata Quality Profile is linked to schema 'DataOfferingShape'.
        '500':
          description: Recalculation request processing failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:internalServerError
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred on the server.
