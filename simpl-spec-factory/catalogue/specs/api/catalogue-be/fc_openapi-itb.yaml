    get:
      tags:
        - SelfDescriptions
      summary: Retrieve the Quality Assessment Record for a Self-Description.
      description: >-
        Returns the full JSON-LD Quality Assessment Record associated with the
        specified Self-Description. A 204 response indicates that the
        Self-Description exists but no Quality Assessment Record is available.

        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
