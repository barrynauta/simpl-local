  /session: #!! Changed to singular, since a user has only 1 session, and the get response is only one session.
    get:
      tags:
        - Session
      description: |-
        **Required RBAC roles:** N/A
      operationId: getCurrentSession
      x-simpl-roles: []
      responses:
        '200':
          description: Get information on the current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                userId: "ExampleCompany-John-Doe"
                creationDatetime: "2024-01-15T09:00:00Z"
                status: active
                roleIds:
                  - "Ro-MU-CA"
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's proactive negotiation headers.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    delete: #!! This should be an implementation detail, logout is SSO-system dependent
      tags:
        - Session
      description: |-
        **Required RBAC roles:** N/A
      operationId: logoutCurrentSession
      x-simpl-roles: []
      responses:
        '200':
          description: The current session was closed
        '500':
          $ref: '#/components/responses/ServerError'

  /webhooks/schemaEvents:
    post:
      tags:
        - Webhooks
      summary: Receive schema lifecycle events from the Schema Manager
      description: >-
        Called by the Schema Manager when a schema is published or revoked.
        Request body is a SchemaChangeEvent.

        **Required RBAC roles:** N/A
      operationId: receiveSchemaChangeEvent
      x-simpl-roles: []
      security: []
      requestBody:
        description: Schema publish or revoke event
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaChangeEvent'
            example:
              eventId: "123e4567-e89b-12d3-a456-426614174000"
              eventType: SchemaPublished
              timestamp: "2026-02-26T14:00:00Z"
              data:
                schema:
                  uri: "https://example.org/schemas/my-schema"
                  title: "My Schema"
                  description: "Example schema for the catalogue"
                  resourceType: "Shape"
                  status: PUBLISHED
                version:
                  uri: "https://example.org/schemas/my-schema/v1"
                  version: "1"
                  changelog: "Initial release"
                  created: "2026-02-26T14:00:00Z"
      responses:
        '200':
          description: Event received successfully
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:badRequest
                href: https://www.belgif.be/specification/rest/api-guide/problems/badRequest.html
                title: Bad Request
                status: 400
                detail: The request body is invalid or does not conform to the SchemaChangeEvent schema.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:internalServerError
                href: https://www.belgif.be/specification/rest/api-guide/problems/internalServerError.html
                title: Internal Server Error
                status: 500
                detail: Internal Server Error
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:unsupportedMediaType
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/415
                title: Unsupported Media Type
                status: 415
                detail: Server refused to accept the request because the message content format is not supported.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
