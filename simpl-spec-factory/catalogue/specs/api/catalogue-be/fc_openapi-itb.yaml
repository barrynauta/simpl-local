openapi: 3.0.2
security:
  - jwt: []
info:
  title: Eclipse XFSC Federated Catalogue
  description: >
    This REST API allows to manage Self-Descriptions, Queries, Schemas and Sessions related the           
    Catalogue.       
    It also provides an endpoint for receiving webhooks about schema lifecycle events from the Schema Manager. 

    ## Authentication & Authorization      
    
    This component is designed to work behind the Tier 2 gateway which can ensure      
    that only authenticated and authorized requests reach the Catalogue.       
    Therefore, the API itself does not implement authentication and authorization enforcement but relies on the Tier 2 gateway for this.
  license:
    name: European Union Public License (EUPL) 1.2
    url: https://interoperable-europe.ec.europa.eu/sites/default/files/custom-page/attachment/eupl_v1.2_en.pdf
  contact:
    name: Simpl Programme
    email: cnect-simpl@ec.europa.eu
    url: https://simpl-programme.ec.europa.eu/
  version: 1.0.0
servers:
  - url: "https://authority.be.authority01.sandbox-cat-dat.simpl-europe.eu/fc/v1"
    description: Configurable server

components:
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:resourceNotFound
            href: https://www.belgif.be/specification/rest/api-guide/problems/resourceNotFound.html
            title: Not Found
            status: 404
            detail: The requested resource was not found.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174003
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:unauthorized
            href: https://www.belgif.be/specification/rest/api-guide/problems/unauthorized.html
            title: Unauthorized
            status: 401
            detail: The request lacks valid authentication credentials.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174001
    Forbidden:
      description: >-
        Forbidden. The user does not have the permission to execute this
        request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:forbidden
            href: https://www.belgif.be/specification/rest/api-guide/problems/forbidden.html
            title: Forbidden
            status: 403
            detail: The authenticated user does not have permission to perform this operation.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174002
    ServerError:
      description: >-
        May contain hints how to solve the error or indicate what went wrong at
        the server. Must not outline any information about the internal
        structure of the server.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:internalServerError
            href: https://www.belgif.be/specification/rest/api-guide/problems/internalServerError.html
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred on the server.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174004
    QualityAssessmentRecordNotFound:
      $ref: ./common/common-components-itb.yaml#/components/responses/QualityAssessmentRecordNotFound
    QualityAssessmentRecordUnauthorized:
      $ref: ./common/common-components-itb.yaml#/components/responses/QualityAssessmentRecordUnauthorized
    QualityAssessmentRecordForbidden:
      $ref: ./common/common-components-itb.yaml#/components/responses/QualityAssessmentRecordForbidden
    QualityAssessmentRecordServerError:
      $ref: ./common/common-components-itb.yaml#/components/responses/QualityAssessmentRecordServerError
    ClientError:
      description: >-
        May contain hints how to solve the error or indicate what was wrong in
        the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:badRequest
            href: https://www.belgif.be/specification/rest/api-guide/problems/badRequest.html
            title: Bad Request
            status: 400
            detail: The input message is incorrect. See error details for hints.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    Conflict:
      description: HTTP Conflict 409
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:conflict
            href: https://www.belgif.be/specification/rest/api-guide/problems/conflict.html
            title: Conflict
            status: 409
            detail: The resource already exists or conflicts with an existing resource.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174005
    Unprocessible:
      description: HTTP Unprocessible Entity 422
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:unprocessableEntity
            href: https://www.belgif.be/specification/rest/api-guide/problems/unprocessableEntity.html
            title: Unprocessable Entity
            status: 422
            detail: The request content is semantically incorrect or violates business rules.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174006
    NotAcceptable:
      description: Not Acceptable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:notAcceptable
            href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
            title: Not Acceptable
            status: 406
            detail: Server cannot produce a response matching the list of acceptable values defined in the request's proactive negotiation headers.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:unsupportedMediaType
            href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/415
            title: Unsupported Media Type
            status: 415
            detail: Server refused to accept the request because the message content format is not supported.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
  schemas:
    Problem:
      description: |
        A Problem Details object (RFC 9457).
        Additional properties specific to the problem type may be present.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: An absolute URI that identifies the problem type
        href:
          type: string
          format: uri
          description: An absolute URI that, when dereferenced, provides human-readable documentation for the problem type.
        title:
          type: string
          description: A short summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: An absolute URI that identifies the specific occurrence of the problem.
    Statement:
      type: object
      properties:
        statement:
          type: string
          example: Match (m:Movie) where m.released > 2000 RETURN m
        parameters:
          $ref: '#/components/schemas/Parameters'
      required:
        - statement
    #      discriminator:
    #        propertyName: type
    #        mapping:
    #          as: "#/components/schemas/AnnotatedStatement"
    Parameters:
      type: object
      additionalProperties:
        type: object
      example:
        name: "John"
        limit: 10
        offset: 5
    Result:
      type: object
      additionalProperties:
        type: object
    QueryLanguage:
      type: string
      enum:
        - OPENCYPHER
        - SPARQL
        - GRAPHQL
      default: OPENCYPHER
    AnnotatedStatement:
      allOf:
        - $ref: '#/components/schemas/Statement'
        - type: object
          properties:
            servers:
              type: array
              uniqueItems: true
              items:
                type: string
                description: known catalog servers already queried in distributed search scenario
            annotations:
              type: object
              additionalProperties:
                type: object
                description: additional properties to tune query execution
              example:
                queryLanguage: SPARQL
                timeout: 30
                withTotalCount: false
    VerificationResult:
      type: object
      properties:
        verificationTimestamp:
          type: string
          format : date-time
        lifecycleStatus: #!! is not known when verifying external SDs -> Julius: You are supposed to compute the status (active, invalid, etc.) from the available information. That is the result of the validation. Maybe rename to just status
          type: string # does the self-description have a lifecycle status in this catalogue?
          description: Lifecycle-state an SD would get, if it would be added to the catalogue.
        issuer: #!! Is this the participant? -> Julius: Yes, the participant that created the SD
          type: string # contains the id of the issuers self-description if available  #!! NOT FURTHER SPECIFIED
          description: ID of the issues Self-Description, if available.
        issuedDateTime:
          type: string
          format: date-time
        validatorDids:
          type: array
          items:
            type: string
            description: The dids of validators, having signed parts of the Self-Description
      required:
        - verificationTimestamp
        - lifecycleStatus #!! is not known when verifying external SDs. Remove from required -> Julius: You are supposed to compute the status (active, invalid, etc.) from the available information. That is the result of the validation. Maybe rename to just status
        - issuer #!! Comment on issuer: if available, but still required?? Remove from required -> Julius: required
        - issuedDateTime
        - validatorDids
    Role: #!! Changed Role from an object with a single String property to simply a String
      type: string
      example: Ro-MU-CA
    Session:
      type: object
      properties:
        userId:
          type: string
        creationDatetime:
          type: string
          format: date-time
        status: #!! What is a status?
          type: string
        #        seed: #!! We must have a seed to do pagination, user must be able to set it? -> Julius: ok
        #          type: string
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    SelfDescription:
      type: object
      properties:
        sdHash:
          type: string
        id: #!! Added id / credentialSubject
          type: string
        status:
          $ref: '#/components/schemas/SelfDescriptionStatus'
        issuer:
          type: string
        validatorDids:
          description: >-
            The credentialSubjects of the parties that validated (parts of) the
            Self-Description
          type: array
          items:
            type: string
        uploadDatetime:
          type: string
          format: date-time
          example: '2022-03-01T13:00:00Z'
          description: The time stamp (ISO8601) when the SD was uploaded.
        statusDatetime:
          type: string
          format: date-time
          example: '2022-05-11T15:30:00Z'
          description: >-
            The last time stamp (ISO8601) the status changed (for this
            Catalogue)
        resourceKey:
          type: string
          description: Stable identifier for the resource across versions.
        currentVersion:
          type: integer
          description: Version number of this resource description.
    SelfDescriptionPublicationResponse:
      $ref: ./common/common-components-itb.yaml#/components/schemas/SelfDescriptionPublicationResponse
    SelfDescriptionQualityAssessment:
      $ref: ./common/common-components-itb.yaml#/components/schemas/SelfDescriptionQualityAssessment
    SelfDescriptionQualityRuleResult:
      $ref: ./common/common-components-itb.yaml#/components/schemas/SelfDescriptionQualityRuleResult
    SelfDescriptionQualityDimensionResult:
      $ref: ./common/common-components-itb.yaml#/components/schemas/SelfDescriptionQualityDimensionResult
    SelfDescriptionQualityOverallResult:
      $ref: ./common/common-components-itb.yaml#/components/schemas/SelfDescriptionQualityOverallResult
    SelfDescriptionQualityStatus:
      $ref: ./common/common-components-itb.yaml#/components/schemas/SelfDescriptionQualityStatus
    QualityAssessmentRecord:
      $ref: ./common/common-components-itb.yaml#/components/schemas/QualityAssessmentRecord
    SelfDescriptionStatus:
      type: string
      enum:
        - active
        - revoked
    SelfDescriptionResult:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/SelfDescription'
        content:
          type: string
    OntologySchema:
      type: object
      properties:
        ontologies:
          description: 'SchemaIds of ontologies, defining the terms of a schema'
          type: array
          items:
            type: string
            example: schemaId
        shapes:
          description: 'SchemaIds of shapes (SHACL Shapes Constraint Language) used to validate instances against the schema.'
          type: array
          items:
            type: string
            example: schemaId
        vocabularies:
          description: 'SchemaIds of controlled vocabularies used in the schema'
          type: array
          items:
            type: string
            example: schemaId
    ResultPage:
      type: object
      properties:
        totalCount:
          type: integer
    SelfDescriptions:
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SelfDescriptionResult'
    Results:
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Result'
    SearchResponsePayload:
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  n:
                    type: object
                    properties:
                      claimsGraphUri:
                        type: array
                        items:
                          type: string
                      offeringType:
                        type: string
                        nullable: true
                      name:
                        type: string
                        nullable: true
                      inLanguage:
                        type: string
                        nullable: true
                      description:
                        type: string
                        nullable: true
                      serviceAccessPoint:
                        type: string
                        nullable: true
                      overallScore:
                        type: number
                        format: double
                        nullable: true
                      overallClassification:
                        type: string
                        nullable: true
              example:
                - n:
                    claimsGraphUri:
                      - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                    offeringType: infrastructure
                    name: text title for infrastructure resource.
                    inLanguage: da
                    description: text description
                    serviceAccessPoint: http://serviceaccesspoint.com
                    overallScore: 0.92
                    overallClassification: Green
                - n:
                    claimsGraphUri:
                      - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                    offeringType: data
                    name: asset 004
                    description: asset description
                    inLanguage: en
                    serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                    overallScore: null
                    overallClassification: null
    WebhookEventType:
      type: string
      enum:
        - SchemaPublished
        - SchemaRevoked
      description: Type of schema lifecycle event
    SchemaCategoryStatus:
      type: string
      enum:
        - PUBLISHED
        - REVOKED
      description: Status of the schema in the catalogue
    EventDataSchema:
      type: object
      properties:
        name: 
          type: string
          description: Schema name
        uri:
          type: string
          description: Schema base URI
        title:
          type: string
        description:
          type: string
        resourceType:
          type: string
        status:
          $ref: '#/components/schemas/SchemaCategoryStatus'
      required:
        - uri
        - title
        - status
    EventDataVersion:
      type: object
      properties:
        uri:
          type: string
          description: Version-specific schema URI
        version:
          type: string
        changelog:
          type: string
        created:
          type: string
          format: date-time
    EventData:
      type: object
      properties:
        schema:
          $ref: '#/components/schemas/EventDataSchema'
        version:
          $ref: '#/components/schemas/EventDataVersion'
          description: Present for SchemaPublished; omitted for SchemaRevoked
      required:
        - schema
    SchemaChangeEvent:
      type: object
      description: Event payload sent by the Schema Manager when a schema is published or revoked
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique identifier of the event
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/EventData'
      required:
        - eventId
        - eventType
        - timestamp
        - data
  parameters:
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      required: false
      description: The number of items to skip before starting to collect the result set.
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      required: false
      description: The number of items to return.
    OrderByParam:
      in: query
      name: orderBy
      schema:
        type: string
      required: false
      description: Results will be sorted by this field.
    AscendingParam:
      in: query
      name: ascending
      schema:
        type: boolean
        default: true
      required: false
      description: Ascending/Descending ordering.
    StatusParam:
      in: query
      name: status
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SelfDescriptionStatus'
      explode: false
      required: false
      description: SelfDescription statuses
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: SelfDescriptions
    description: >-
      Retrieving Self-Descriptions from the Catalogue. All Self-Descriptions are
      JSON-LD files. They are referenced by their sha256 hash. Catalogues
      synchronize by downloading changesets (lists of hashes) from known other
      Catalogues and reading the full Self-Descriptions of entries that are
      unknown to them.
    externalDocs:
      description: Find out more
      url: http://gaiax.io
  - name: Query
    description: Send graph queries to this Catalogue.
  - name: Schemas
    description: >-
      The format of the self-descriptions are defined by schemas in the
      catalogue. Here you get information about the latest schema.
  - name: Verification
    description: The Catalogue provides a verification service for e.g. checking the syntax
  - name: Session
    description: Management for auth sessions in the catalogue
  - name: Webhooks
    description: Inbound webhooks for schema lifecycle events from the Schema Manager
paths:
  /selfDescriptions/quickSearch:
    get:
      tags:
        - SelfDescriptions
      description: |-
        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      operationId: selfDescriptionsQuickSearchGet
      summary: Quick search active Resource Descriptions.
      parameters:
        - name: searchTerm
          in: query
          required: true
          schema:
            type: string
        - name: minimumScore
          in: query
          required: false
          schema:
            type: number
            format: double
          description: Optional. Minimum overall quality score. Must be >= 0.
        - name: minimumClassification
          in: query
          required: false
          schema:
            type: string
          description: Optional. Minimum overall quality classification from the active MQP.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: User-Attributes
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search response with active Resource Description quality summary fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponsePayload'
              example:
                totalCount: 2
                items:
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                      offeringType: infrastructure
                      name: text title for infrastructure resource.
                      inLanguage: da
                      description: text description
                      serviceAccessPoint: http://serviceaccesspoint.com
                      overallScore: 0.92
                      overallClassification: Green
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                      offeringType: data
                      name: asset 004
                      description: asset description
                      inLanguage: en
                      serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                      overallScore: null
                      overallClassification: null
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnBadRequestInvalidMinimumScore:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumScore must be greater than or equal to 0.
                returnBadRequestInvalidMinimumClassification:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumClassification is not a supported quality classification value.
        '500':
          $ref: '#/components/responses/ServerError'
  /selfDescriptions/advancedSearch:
    post:
      tags:
        - SelfDescriptions
      operationId: selfDescriptionsAdvancedSearchPost
      summary: Advanced search active Resource Descriptions.
      description: |-
        Optional root fields minimumScore (>= 0) and minimumClassification may be included to filter by quality assessment results.

        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      parameters:
        - name: User-Attributes
          in: header
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
            examples:
              returnValidResponse:
                value:
                  simpl:GeneralServiceProperties:
                    name: asset002
              returnValidResponseWithQualityFilters:
                value:
                  minimumScore: 75
                  minimumClassification: good
                  simpl:GeneralServiceProperties:
                    name: asset002
      responses:
        '200':
          description: Search response with active Resource Description quality summary fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponsePayload'
              example:
                totalCount: 2
                items:
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                      offeringType: infrastructure
                      name: text title for infrastructure resource.
                      inLanguage: da
                      description: text description
                      serviceAccessPoint: http://serviceaccesspoint.com
                      overallScore: 0.92
                      overallClassification: Green
                  - n:
                      claimsGraphUri:
                        - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                      offeringType: data
                      name: asset 004
                      description: asset description
                      inLanguage: en
                      serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                      overallScore: null
                      overallClassification: null
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnBadRequestInvalidMinimumScore:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumScore must be greater than or equal to 0.
                returnBadRequestInvalidMinimumClassification:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumClassification is not a supported quality classification value.
        '500':
          $ref: '#/components/responses/ServerError'
  /selfDescriptions:
    get:
      tags:
        - SelfDescriptions
      summary: Get the list of metadata of Self-Descriptions in the Catalogue
      description: |-
        **Required ABAC roles (any one of):** `CATALOGUE_SEARCHER`, `DATA_PROVIDER_PUBLISHER`, `APP_PROVIDER_PUBLISHER`, `INFRA_PROVIDER_PUBLISHER`
      operationId: readSelfDescriptions
      parameters: #!! Added filter parameters for all(?) metadata fields
        - name: uploadTimerange
          in: query
          description: >-
            Filter for the time range when the Self-Description was uploaded to
            the catalogue. The time range has to be specified as start time and
            end time as ISO8601 timestamp separated by a `/`.
          required: false
          example: 2022-03-01T13:00:00Z/2022-05-11T15:30:00Z
          schema:
            type: string
        - name: statusTimerange
          in: query
          description: >-
            Filter for the time range when the status of the Self-Description
            was last changed in the catalogue. The time range has to be
            specified as start time and end time as ISO8601 timestamp separated
            by a `/`.
          required: false
          example: 2022-03-01T13:00:00Z/2022-05-11T15:30:00Z
          schema:
            type: string
        - name: issuer
          in: query
          description: >-
            Filter for the issuer of the Self-Description. This is the unique ID
            of the Participant that has prepared the Self-Description.
          required: false
          schema:
            type: array
            items:
