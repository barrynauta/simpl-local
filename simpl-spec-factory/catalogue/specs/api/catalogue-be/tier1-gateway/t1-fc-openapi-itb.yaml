openapi: 3.0.2
info:
  title: Eclipse XFSC Federated Catalogue (Tier 1 Gateway)
  version: 1.0.0
servers:
- url: https://authority.be.authority01.sandbox-cat-dat.simpl-europe.eu/fc/v1
  description: Configurable server
security:
- jwt: []
paths:
  /schemas:
    get:
      tags:
      - Schemas
      summary: Get the full list of ontologies, shapes and vocabularies.
      description: |-
        The schema identifiers, returned by this endpoint can be used to download the schema files.

        **Required RBAC roles (any one of):** `GA_SCHEMA_VIEWER`, `GA_SCHEMA_ADMIN`
      operationId: getSchemas
      x-simpl-roles:
      - GA_SCHEMA_VIEWER
      - GA_SCHEMA_ADMIN
      responses:
        '200':
          description: References to ontologies, shapes and vocabularies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologySchema'
              example:
                ontologies:
                - https://example.org/schemas/my-ontology
                shapes:
                - https://example.org/schemas/my-shape
                vocabularies:
                - https://example.org/schemas/my-vocabulary
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's proactive
                  negotiation headers.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    post:
      tags:
      - Schemas
      summary: Add a new Schema to the catalogue.
      description: |-
        This endpoint accepts either an ontology (OWL file), shape (SHACL file) or controlled vocabulary (SKOS file), which is added to the schemas of the catalogue.

        **Required RBAC roles:** N/A
      operationId: addSchema
      x-simpl-roles: []
      requestBody:
        description: The file of the new schema. either an ontology (OWL file), shape (SHACL file) or controlled vocabulary
          (SKOS file).
        content:
          application/rdf+xml:
            schema:
              type: string
              description: OWL file describing the ontology of the schema or SKOS file describing the controlled vocabulary.
            example: "<?xml version=\"1.0\"?>\n<rdf:RDF xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\" xmlns:owl=\"\
              http://www.w3.org/2002/07/owl#\">\n  <owl:Ontology rdf:about=\"https://example.org/schemas/my-ontology\"/>\n\
              </rdf:RDF>\n"
          application/ld+json:
            schema:
              type: string
              description: OWL or SHACL file describing the ontology.
            example:
              '@context': https://www.w3.org/ns/owl.jsonld
              '@type': owl:Ontology
              '@id': https://example.org/schemas/my-ontology
          application/json:
            schema:
              type: string
              description: OWL or SHACL file describing the ontology.
            example:
              '@context': https://www.w3.org/ns/owl.jsonld
              '@type': owl:Ontology
              '@id': https://example.org/schemas/my-ontology
          text/turtle:
            schema:
              type: string
              description: SHACL file describing the ontology of the schema.
            example: '@prefix owl: <http://www.w3.org/2002/07/owl#> .

              @prefix sh: <http://www.w3.org/ns/shacl#> .

              @prefix ex: <https://example.org/> .

              ex:MyShape a sh:NodeShape ; sh:targetClass ex:MyClass .

              '
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the added Schema.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:unsupportedMediaType
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/415
                title: Unsupported Media Type
                status: 415
                detail: Server refused to accept the request because the message content format is not supported.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
  /schemas/latest:
    get:
      tags:
      - Schemas
      summary: Get the latest schema for a given type. If no term is specified, then the composite schema is returned.
      description: |-
        Get the latest schema for a given type. If no term is specified, then the composite schema is returned.

        **Required RBAC roles (any one of):** `GA_SCHEMA_VIEWER`, `GA_SCHEMA_ADMIN`
      operationId: getLatestSchema
      x-simpl-roles:
      - GA_SCHEMA_VIEWER
      - GA_SCHEMA_ADMIN
      parameters:
      - name: type
        in: query
        description: Type of the schema.
        required: true
        schema:
          type: string
          enum:
          - ontology
          - shape
          - vocabulary
      - name: term
        in: query
        description: The URI of the term of the requested Self-Description schema e.g. `http://w3id.org/gaia-x/service#ServiceOffering`
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The latest schemas for the given type or term.
          headers:
            Vary:
              description: Indicates the response varies based on Accept header.
              schema:
                type: string
                example: Accept
          content:
            application/rdf+xml:
              schema:
                type: string
                description: OWL file describing the ontology of the schema or SKOS file describing the controlled vocabulary.
              example: "<?xml version=\"1.0\"?>\n<rdf:RDF xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\" xmlns:owl=\"\
                http://www.w3.org/2002/07/owl#\">\n  <owl:Ontology rdf:about=\"https://example.org/schemas/my-ontology\"/>\n\
                </rdf:RDF>\n"
            text/turtle:
              schema:
                type: string
                description: SHACL file describing the ontology of the schema.
              example: '@prefix sh: <http://www.w3.org/ns/shacl#> .

                @prefix ex: <https://example.org/> .

                ex:MyShape a sh:NodeShape ; sh:targetClass ex:MyClass .

                '
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's proactive
                  negotiation headers.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
  /schemas/{schemaId}:
    get:
      tags:
      - Schemas
      summary: Get a specific schema.
      description: |-
        Get a specific schema.

        **Required RBAC roles (any one of):** `GA_SCHEMA_VIEWER`, `GA_SCHEMA_ADMIN`
      operationId: getSchema
      x-simpl-roles:
      - GA_SCHEMA_VIEWER
      - GA_SCHEMA_ADMIN
      parameters:
      - name: schemaId
        in: path
        description: Identifier of the Schema.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The schema for the given identifier. Depending on the type of the schema, either an ontology, shape
            graph or controlled vocabulary is returned.
          headers:
            Vary:
              description: Indicates the response varies based on Accept header.
              schema:
                type: string
                example: Accept
          content:
            application/rdf+xml:
              schema:
                type: string
                description: OWL file describing the ontology of the schema or SKOS file describing the controlled vocabulary.
              example: "<?xml version=\"1.0\"?>\n<rdf:RDF xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\" xmlns:owl=\"\
                http://www.w3.org/2002/07/owl#\">\n  <owl:Ontology rdf:about=\"https://example.org/schemas/my-ontology\"/>\n\
                </rdf:RDF>\n"
            text/turtle:
              schema:
                type: string
                description: SHACL file describing the ontology of the schema.
              example: '@prefix sh: <http://www.w3.org/ns/shacl#> .

                @prefix ex: <https://example.org/> .

                ex:MyShape a sh:NodeShape ; sh:targetClass ex:MyClass .

                '
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's proactive
                  negotiation headers.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
      - Schemas
      summary: Replace a schema. This is only allowed for ontologies with the same IRI.
      description: |-
        Replace a schema. This is only allowed for ontologies with the same IRI.

        **Required RBAC roles:** N/A
      operationId: updateSchema
      x-simpl-roles: []
      parameters:
      - name: schemaId
        in: path
        description: Identifier of the Schema.
        required: true
        schema:
          type: string
      requestBody:
        description: The new ontology (OWL file).
        content:
          application/rdf+xml:
            schema:
              type: string
              description: OWL file describing the ontology.
            example: "<?xml version=\"1.0\"?>\n<rdf:RDF xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\" xmlns:owl=\"\
              http://www.w3.org/2002/07/owl#\">\n  <owl:Ontology rdf:about=\"https://example.org/schemas/my-ontology\"/>\n\
              </rdf:RDF>\n"
          application/ld+json:
            schema:
              type: string
              description: OWL or SHACL file describing the ontology.
            example:
              '@context': https://www.w3.org/ns/owl.jsonld
              '@type': owl:Ontology
              '@id': https://example.org/schemas/my-ontology
          application/json:
            schema:
              type: string
              description: OWL or SHACL file describing the ontology.
            example:
              '@context': https://www.w3.org/ns/owl.jsonld
              '@type': owl:Ontology
              '@id': https://example.org/schemas/my-ontology
          text/turtle:
            schema:
              type: string
              description: SHACL file describing the ontology of the schema.
            example: '@prefix owl: <http://www.w3.org/2002/07/owl#> .

              @prefix sh: <http://www.w3.org/ns/shacl#> .

              @prefix ex: <https://example.org/> .

              ex:MyShape a sh:NodeShape ; sh:targetClass ex:MyClass .

              '
        required: true
      responses:
        '200':
          description: Updated.
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:unsupportedMediaType
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/415
                title: Unsupported Media Type
                status: 415
                detail: Server refused to accept the request because the message content format is not supported.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    delete:
      tags:
      - Schemas
      summary: Delete a Schema
      description: |-
        Delete a Schema.

        **Required RBAC roles:** N/A
      operationId: deleteSchema
      x-simpl-roles: []
      parameters:
      - name: schemaId
        in: path
        description: Identifier of the Schema
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deleted Schema
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /schemas/{schemaName}/recalcQualityScore:
    post:
      tags:
      - Schemas
      summary: Trigger quality score recalculation for a schema.
      description: |-
        Acknowledges a request to recalculate quality scores for all Resource Descriptions linked to the schema.

        **Required RBAC roles:** N/A
      operationId: triggerQualityScoreRecalculation
      x-simpl-roles: []
      parameters:
      - name: schemaName
        in: path
        description: Name of the schema whose linked Resource Descriptions must be rescored.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z][A-Za-z0-9]{2,63}$'
      requestBody:
        description: Metadata Quality Profile version that triggered the recalculation.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - profileVersion
              properties:
                profileVersion:
                  type: string
                profileId:
                  type: string
            example:
              profileVersion: 1.2.0
              profileId: urn:simpl:mqp:DataOfferingShape:1.2.0
      responses:
        '202':
          description: Recalculation request accepted for asynchronous processing.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - schemaName
                - profileVersion
                - estimatedResourceCount
                properties:
                  status:
                    type: string
                  schemaName:
                    type: string
                  profileVersion:
                    type: string
                  estimatedResourceCount:
                    type: integer
              example:
                status: ACCEPTED
                schemaName: DataOfferingShape
                profileVersion: 1.2.0
                estimatedResourceCount: 1250
        '400':
          description: Invalid schema name or request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:catalogue:invalidInput
                title: Invalid input
                status: 400
                detail: schemaName 'data offering shape' is invalid. Must be PascalCase alphanumeric, 3-64 characters.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The schema or its active Metadata Quality Profile was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                schemaNotFound:
                  value:
                    type: urn:problem-type:simpl:catalogue:schemaNotFound
                    title: Schema not found
                    status: 404
                    detail: Schema 'UnknownShape' could not be resolved.
                activeQualityProfileNotFound:
                  value:
                    type: urn:problem-type:simpl:catalogue:activeQualityProfileNotFound
                    title: Active quality profile not found
                    status: 404
                    detail: No active Metadata Quality Profile is linked to schema 'DataOfferingShape'.
        '500':
          description: Recalculation request processing failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:internalServerError
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred on the server.
  /verification:
    get:
      tags:
      - Verification
      summary: Show a HTML page to verify (portions of) a signed Self-Description
      description: |-
        Show a HTML page to verify (portions of) a signed Self-Description.

        **Required RBAC roles:** N/A
      operationId: verifyPage
      x-simpl-roles: []
      responses:
        '200':
          description: HTML document that contains a query field to verify (portions of) Self-Descriptions.
          content:
            text/html:
              schema:
                type: string
              example: <html><body><h1>Verification Interface</h1><form method="post" action="/v1/verification"><textarea
                name="sd" placeholder="Paste your JSON-LD Self-Description here"></textarea><button type="submit">Verify</button></form></body></html>
        '400':
          $ref: '#/components/responses/ClientError'
        '500':
          $ref: '#/components/responses/ServerError'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
