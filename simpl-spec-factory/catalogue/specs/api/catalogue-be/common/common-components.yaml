openapi: 3.0.2
components:
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden. The user does not have the permission to execute this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: May contain hints how to solve the error or indicate what went wrong at the server. Must not outline any
        information about the internal structure of the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QualityAssessmentRecordNotFound:
      description: The specified resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:resourceNotFound
            href: https://www.belgif.be/specification/rest/api-guide/problems/resourceNotFound.html
            title: Not Found
            status: 404
            detail: The requested resource was not found.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174003
    QualityAssessmentRecordUnauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:unauthorized
            href: https://www.belgif.be/specification/rest/api-guide/problems/unauthorized.html
            title: Unauthorized
            status: 401
            detail: The request lacks valid authentication credentials.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174001
    QualityAssessmentRecordForbidden:
      description: Forbidden. The user does not have the permission to execute this request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:forbidden
            href: https://www.belgif.be/specification/rest/api-guide/problems/forbidden.html
            title: Forbidden
            status: 403
            detail: The authenticated user does not have permission to perform this operation.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174002
    QualityAssessmentRecordServerError:
      description: May contain hints how to solve the error or indicate what went wrong at the server. Must not outline any
        information about the internal structure of the server.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:internalServerError
            href: https://www.belgif.be/specification/rest/api-guide/problems/internalServerError.html
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred on the server.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174004
    ClientError:
      description: May contain hints how to solve the error or indicate what was wrong in the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: HTTP Conflict 409
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessible:
      description: HTTP Unprocessible Entity 422
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    Problem:
      description: 'A Problem Details object (RFC 9457).

        Additional properties specific to the problem type may be present.

        '
      type: object
      properties:
        type:
          type: string
          format: uri
          description: An absolute URI that identifies the problem type
        href:
          type: string
          format: uri
          description: An absolute URI that, when dereferenced, provides human-readable documentation for the problem type.
        title:
          type: string
          description: A short summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: An absolute URI that identifies the specific occurrence of the problem.
    Statement:
      type: object
      properties:
        statement:
          type: string
          example: Match (m:Movie) where m.released > 2000 RETURN m
        parameters:
          $ref: '#/components/schemas/Parameters'
      required:
      - statement
    Parameters:
      type: object
      additionalProperties:
        type: object
      example:
        name: John
        limit: 10
        offset: 5
    Result:
      type: object
      additionalProperties:
        type: object
    QueryLanguage:
      type: string
      enum:
      - OPENCYPHER
      - SPARQL
      - GRAPHQL
      default: OPENCYPHER
    AnnotatedStatement:
      allOf:
      - $ref: '#/components/schemas/Statement'
      - type: object
        properties:
          servers:
            type: array
            uniqueItems: true
            items:
              type: string
              description: known catalog servers already queried in distributed search scenario
          annotations:
            type: object
            additionalProperties:
              type: object
              description: additional properties to tune query execution
            example:
              queryLanguage: SPARQL
              timeout: 30
              withTotalCount: false
    VerificationResult:
      type: object
      properties:
        verificationTimestamp:
          type: string
          format: date-time
        lifecycleStatus:
          type: string
          description: Lifecycle-state an SD would get, if it would be added to the catalogue.
        issuer:
          type: string
          description: ID of the issues Self-Description, if available.
        issuedDateTime:
          type: string
          format: date-time
        validatorDids:
          type: array
          items:
            type: string
            description: The dids of validators, having signed parts of the Self-Description
      required:
      - verificationTimestamp
      - lifecycleStatus
      - issuer
      - issuedDateTime
      - validatorDids
    Role:
      type: string
      example: Ro-MU-CA
    Session:
      type: object
      properties:
        userId:
          type: string
        creationDatetime:
          type: string
          format: date-time
        status:
          type: string
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    SelfDescription:
      type: object
      properties:
        sdHash:
          type: string
        id:
          type: string
        status:
          $ref: '#/components/schemas/SelfDescriptionStatus'
        issuer:
          type: string
        validatorDids:
          description: The credentialSubjects of the parties that validated (parts of) the Self-Description
          type: array
          items:
            type: string
        uploadDatetime:
          type: string
          format: date-time
          example: '2022-03-01T13:00:00Z'
          description: The time stamp (ISO8601) when the SD was uploaded.
        statusDatetime:
          type: string
          format: date-time
          example: '2022-05-11T15:30:00Z'
          description: The last time stamp (ISO8601) the status changed (for this Catalogue)
        resourceKey:
          type: string
          description: Stable identifier for the resource across versions.
        currentVersion:
          type: integer
          description: Version number of this resource description.
    SelfDescriptionPublicationResponse:
      allOf:
      - $ref: '#/components/schemas/SelfDescription'
      - type: object
        required:
        - qualityAssessment
        properties:
          qualityAssessment:
            $ref: '#/components/schemas/SelfDescriptionQualityAssessment'
    SelfDescriptionQualityAssessment:
      type: object
      required:
      - rules
      - dimensions
      - overall
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SelfDescriptionQualityRuleResult'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/SelfDescriptionQualityDimensionResult'
        overall:
          $ref: '#/components/schemas/SelfDescriptionQualityOverallResult'
    SelfDescriptionQualityRuleResult:
      type: object
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/SelfDescriptionQualityStatus'
    SelfDescriptionQualityDimensionResult:
      type: object
      required:
      - name
      - score
      - classification
      properties:
        name:
          type: string
        score:
          type: number
          format: double
        classification:
          type: string
        thresholdStatus:
          $ref: '#/components/schemas/SelfDescriptionQualityStatus'
    SelfDescriptionQualityOverallResult:
      type: object
      required:
      - score
      - classification
      - thresholdStatus
      properties:
        score:
          type: number
          format: double
        classification:
          type: string
        thresholdStatus:
          $ref: '#/components/schemas/SelfDescriptionQualityStatus'
    SelfDescriptionQualityStatus:
      type: string
      enum:
      - PASSED
      - FAILED
    QualityAssessmentRecord:
      type: object
      description: >-
        JSON-LD Quality Assessment Record produced by the Quality Scoring Service.
        The graph contains the assessed resource description and the metadata quality
        profile, dimension, dimension-score, self-description-score, rule-evaluation,
        and QAR nodes.
      required:
      - '@graph'
      properties:
        '@context':
          description: JSON-LD context used by the Quality Assessment Record.
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - type: string
              - type: object
                additionalProperties: true
          - type: object
            additionalProperties: true
        '@graph':
          type: array
          minItems: 1
          items:
            type: object
            required:
            - '@id'
            - '@type'
            additionalProperties: true
      additionalProperties: true
    SelfDescriptionStatus:
      type: string
      enum:
      - active
      - revoked
    SelfDescriptionResult:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/SelfDescription'
        content:
          type: string
    OntologySchema:
      type: object
      properties:
        ontologies:
          description: SchemaIds of ontologies, defining the terms of a schema
          type: array
          items:
            type: string
            example: schemaId
        shapes:
          description: SchemaIds of shapes (SHACL Shapes Constraint Language) used to validate instances against the schema.
          type: array
          items:
            type: string
            example: schemaId
        vocabularies:
          description: SchemaIds of controlled vocabularies used in the schema
          type: array
          items:
            type: string
            example: schemaId
    ResultPage:
      type: object
      properties:
        totalCount:
          type: integer
    SelfDescriptions:
      allOf:
      - $ref: '#/components/schemas/ResultPage'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/SelfDescriptionResult'
    Results:
      allOf:
      - $ref: '#/components/schemas/ResultPage'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Result'
    SearchResponsePayload:
      allOf:
      - $ref: '#/components/schemas/ResultPage'
      - type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                n:
                  type: object
                  properties:
                    claimsGraphUri:
                      type: array
                      items:
                        type: string
                    offeringType:
                      type: string
                      nullable: true
                    name:
                      type: string
                      nullable: true
                    inLanguage:
                      type: string
                      nullable: true
                    description:
                      type: string
                      nullable: true
                    serviceAccessPoint:
                      type: string
                      nullable: true
                    overallScore:
                      type: number
                      format: double
                      nullable: true
                    overallClassification:
                      type: string
                      nullable: true
            example:
            - n:
                claimsGraphUri:
                - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                offeringType: infrastructure
                name: text title for infrastructure resource.
                inLanguage: da
                description: text description
                serviceAccessPoint: http://serviceaccesspoint.com
                overallScore: 0.92
                overallClassification: Green
            - n:
                claimsGraphUri:
                - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                offeringType: data
                name: asset 004
                description: asset description
                inLanguage: en
                serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                overallScore: null
                overallClassification: null
    WebhookEventType:
      type: string
      enum:
      - SchemaPublished
      - SchemaRevoked
      description: Type of schema lifecycle event
    SchemaCategoryStatus:
      type: string
      enum:
      - PUBLISHED
      - REVOKED
      description: Status of the schema in the catalogue
    EventDataSchema:
      type: object
      properties:
        name:
          type: string
          description: Schema name
        uri:
          type: string
          description: Schema base URI
        title:
          type: string
        description:
          type: string
        resourceType:
          type: string
        status:
          $ref: '#/components/schemas/SchemaCategoryStatus'
      required:
      - uri
      - title
      - status
    EventDataVersion:
      type: object
      properties:
        uri:
          type: string
          description: Version-specific schema URI
        version:
          type: string
        changelog:
          type: string
        created:
          type: string
          format: date-time
    EventData:
      type: object
      properties:
        schema:
          $ref: '#/components/schemas/EventDataSchema'
        version:
          $ref: '#/components/schemas/EventDataVersion'
          description: Present for SchemaPublished; omitted for SchemaRevoked
      required:
      - schema
    SchemaChangeEvent:
      type: object
      description: Event payload sent by the Schema Manager when a schema is published or revoked
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique identifier of the event
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/EventData'
      required:
      - eventId
      - eventType
      - timestamp
      - data
  parameters:
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      required: false
      description: The number of items to skip before starting to collect the result set.
    LimitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      required: false
      description: The number of items to return.
    OrderByParam:
      in: query
      name: orderBy
      schema:
        type: string
      required: false
      description: Results will be sorted by this field.
    AscendingParam:
      in: query
      name: ascending
      schema:
        type: boolean
        default: true
      required: false
      description: Ascending/Descending ordering.
    StatusParam:
      in: query
      name: statuses
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SelfDescriptionStatus'
      explode: false
      required: false
      description: SelfDescription statuses
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
