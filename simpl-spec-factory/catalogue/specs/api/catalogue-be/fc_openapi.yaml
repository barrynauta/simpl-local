openapi: 3.0.2
info:
  title: Eclipse XFSC Federated Catalogue
  description: "This REST API allows to manage Self-Descriptions, Queries, Schemas and Sessions\
    \ related the            Catalogue.        It also provides an endpoint for receiving webhooks about schema lifecycle\
    \ events from the Schema Manager. \n## Authentication & Authorization      \nThis component is designed to work behind\
    \ the Tier 2 gateway which can ensure       that only authenticated and authorized requests reach the Catalogue.     \
    \   Therefore, the API itself does not implement authentication and authorization enforcement but relies on the Tier 2\
    \ gateway for this.\n"
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: '{baseUrl}'
  description: Configurable server
  variables:
    baseUrl:
      default: https://authority.be.authority01.sandbox-cat-dat.simpl-europe.eu/fc
security:
- OAuth2Auth: []
tags:
- name: SelfDescriptions
  description: Retrieving Self-Descriptions from the Catalogue. All Self-Descriptions are JSON-LD files. They are referenced
    by their sha256 hash. Catalogues synchronize by downloading changesets (lists of hashes) from known other Catalogues and
    reading the full Self-Descriptions of entries that are unknown to them.
  externalDocs:
    description: Find out more
    url: http://gaiax.io
- name: Query
  description: Send graph queries to this Catalogue.
- name: Schemas
  description: The format of the self-descriptions are defined by schemas in the catalogue. Here you get information about
    the latest schema.
- name: Verification
  description: The Catalogue provides a verification service for e.g. checking the syntax
- name: Session
  description: Management for auth sessions in the catalogue
- name: Webhooks
  description: Inbound webhooks for schema lifecycle events from the Schema Manager
