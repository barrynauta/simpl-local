        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (1-based). Must be greater than 0.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Number of items per page. Must be greater than 0.
      - name: User-Attributes
        in: header
        required: false
        schema:
          type: string
        description: Optional user attributes header
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchResponsePayload'
              examples:
                returnValidResponse:
                  value:
                    totalCount: 1
                    items:
                    - n:
                        claimsGraphUri:
                        - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                        offeringType: infrastructure
                        name: text title for infrastructure resource.
                        inLanguage: da
                        description: text description
                        serviceAccessPoint: http://serviceaccesspoint.com
        '403':
          $ref: '#/components/responses/forbiddenErrorResponse'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /participants/resourceDescriptions/{resourceDescriptionId}:
    get:
      parameters:
      - name: resourceDescriptionId
        in: path
        description: value defined in credentialSubject.@id for given resource description
        required: true
        schema:
          type: string
        examples:
          returnValidResponse:
            value: 3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_252
      tags:
      - Participant resource description
      summary: Return details of given resource description stored in federated catalogue
      responses:
        '200':
          $ref: '#/components/responses/getResourceDescriptionResponse'
        '403':
          $ref: '#/components/responses/forbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/notFoundErrorResponse'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    patch:
      tags:
      - Participant resource description
      summary: Revoke existing resource description. Endpoint will behave idempotently if resource description is already
        revoked.
      parameters:
      - name: resourceDescriptionId
        in: path
        required: true
        schema:
          type: string
          example: did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_eng_custom5
        description: value defined in credentialSubject.@id for given resource description
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/notFoundErrorResponse'
        '403':
          $ref: '#/components/responses/forbiddenErrorResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /federated/resourceDescriptions/{resourceDescriptionId}:
    get:
      tags:
      - Federated resource description
      operationId: getFederatedResourceDescription
      summary: Retrieve a federated resource description
      description: >-
        The Trustor Governance Authority receives this request from a Trusted
        Governance Authority. The gateway authenticates the Trusted Governance
        Authority using mutual TLS, maps the Consumer's identity attributes,
        and evaluates discovery ABAC before forwarding this request. The gateway
        supplies User-Attributes and Correlation-Id to the adapter. The adapter
        does not repeat gateway authorization or require OAuth2 for this
        operation. Gateway-generated authentication and ABAC errors are outside
        this adapter response contract. The response contains the complete
        resource description, but does not return a separate schema.
      security: []
      parameters:
      - name: resourceDescriptionId
        in: path
        required: true
        description: Identifier of the resource description in the Federated Catalogue.
        schema:
          type: string
          minLength: 1
        example: did:web:registry.gaia-x.eu:DataOffering:fMw2UtNCDW-ydI83YKscqCKa-n75jJ0qY7v0
      - name: User-Attributes
        in: header
        required: true
        description: Consumer identity attributes forwarded by the gateway after discovery ABAC.
        schema:
          type: string
          minLength: 1
        example: CONSUMER
      - name: Correlation-Id
        in: header
        required: true
        description: Request correlation identifier forwarded by the gateway; echoed in the response header only.
        schema:
          type: string
          minLength: 1
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          $ref: '#/components/responses/federatedResourceDescriptionResponse'
        '400':
          $ref: '#/components/responses/federatedBadRequestResponse'
        '404':
          $ref: '#/components/responses/federatedNotFoundResponse'
        '406':
          $ref: '#/components/responses/federatedNotAcceptableResponse'
        '500':
          $ref: '#/components/responses/federatedInternalServerErrorResponse'
  /participants/resourceDescriptions/{resourceDescriptionId}/version:
    get:
      tags:
      - Participant resource description
      summary: Return list of resource descriptions with the same parent resource description id.
      parameters:
      - name: resourceDescriptionId
        in: path
        description: Parent resource description id.
        required: true
        schema:
          type: string
        examples:
          validResourceDescriptionId:
            value: 3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_252
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (1-based). Must be greater than 0.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Number of items per page. Must be greater than 0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/versionHistoryResponsePayload'
              examples:
                returnValidResponse:
                  value:
                    totalCount: 2
                    items:
                    - n:
                        claimsGraphUri:
                        - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                        offeringType: infrastructure
                        name: text title for infrastructure resource.
                        inLanguage: da
                        description: text description
                        serviceAccessPoint: http://serviceaccesspoint.com
                        version: 2
                    - n:
                        claimsGraphUri:
                        - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                        offeringType: infrastructure
                        name: asset03
                        description: asset description
                        inLanguage: en
                        serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                        version: 1
        '401':
          $ref: '#/components/responses/unauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/forbiddenErrorResponse'
        '404':
          $ref: '#/components/responses/notFoundErrorResponse'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable values defined in the request's
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
