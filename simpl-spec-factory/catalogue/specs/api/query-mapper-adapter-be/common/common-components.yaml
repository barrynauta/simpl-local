openapi: 3.0.1
components:
  securitySchemes:
    OAuth2Auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/oauth/authorize
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            read: Read access
            write: Write access
  schemas:
    Problem:
      description: 'A Problem Details object (RFC 9457).


        Additional properties specific to the problem type may be present.

        '
      type: object
      properties:
        type:
          type: string
          format: uri
          pattern: '^[A-Za-z][A-Za-z0-9+.-]*:[^\s]+$'
          description: An absolute URI that identifies the problem type
          default: about:blank
        href:
          type: string
          format: uri
          description: An absolute URI that, when dereferenced, provides human-readable documentation for the problem type
            (e.g. using HTML).
        title:
          type: string
          description: A short summary of the problem type. Written in English and readable for engineers (usually not suited
            for non technical stakeholders and not localized).
          example: Service Unavailable
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          format: uri
          description: An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further
            information if dereferenced.
      example:
        type: urn:problem-type:exampleOrganization:exampleProblem
        href: https://www.belgif.be/specification/rest/api-guide/#standardized-problem-types
        title: Description of the type of problem that occurred
        status: 400
        detail: Description of specific occurrence of the problem
        instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    federatedResourceDescriptionPayload:
      type: object
      description: Full resource description returned without a separate schema.
      additionalProperties: false
      required:
      - resourceDescription
      properties:
        resourceDescription:
          type: object
          description: >-
            Complete Federated Catalogue resource description (including its
            credentialSubject and dct:conformsTo); the JSON-LD properties vary by
            offering type and are not truncated or projected.
          additionalProperties: true
    searchResponsePayload:
      type: object
      required:
      - totalCount
      - items
      - page
      - pageSize
      - total
      - totalPages
      - next
      properties:
        totalCount:
          type: integer
          example: 2
          description: Number of found Resource description.
        items:
          type: array
          items:
            type: object
            properties:
              n:
                type: object
                properties:
                  claimsGraphUri:
                    type: array
                    items:
                      type: string
                  offeringType:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
                  inLanguage:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  serviceAccessPoint:
                    type: string
                    nullable: true
                  overallScore:
                    type: number
                    format: double
                    nullable: true
                    description: Overall quality score from the active resource description quality assessment result.
                  overallClassification:
                    type: string
                    nullable: true
                    description: Overall quality classification from the active resource description quality assessment result.
          example:
          - n:
              claimsGraphUri:
              - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
              offeringType: infrastructure
              name: text title for infrastructure resource.
              inLanguage: da
              description: text description
              serviceAccessPoint: http://serviceaccesspoint.com
              overallScore: 0.92
              overallClassification: Green
          - n:
              claimsGraphUri:
              - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
              offeringType: data
              name: asset 004
              description: asset description
              inLanguage: en
              serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
              overallScore: null
              overallClassification: null
          description: An array of general service properties nodes of a filtered out resource descriptions
        page:
          type: integer
          example: 1
          description: Current 1-based page number.
        pageSize:
          type: integer
          example: 20
          description: Effective number of items per page, capped at 100.
        total:
          type: integer
          example: 150
          description: Total number of items across all pages.
        totalPages:
          type: integer
          example: 8
          description: Total number of pages.
        next:
          type: string
          nullable: true
          example: /selfDescriptions?searchString=test&page=2&pageSize=20
          description: Relative URL to the next page, or null when no next page is available. Advanced-search clients
            must resend the same POST body to the URL returned for that operation.
    versionHistoryResponsePayload:
      type: object
      properties:
        totalCount:
          type: integer
          example: 2
          description: Number of found version entries.
        items:
          type: array
          items:
            type: object
            properties:
              n:
                type: object
                properties:
                  claimsGraphUri:
                    type: array
                    items:
                      type: string
                  offeringType:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
                  inLanguage:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  serviceAccessPoint:
                    type: string
                    nullable: true
                  version:
                    type: integer
                    nullable: true
          description: An array of version history items with mapped resource description properties
    advancedSearchRequestPayload:
      type: object
      description: Since resource descriptions as of now are schemaless the request body can be any JSON with proper structure.
        Each JSON root key needs to correspond to a resource description node name. As a value for that key an JSON object
        need to be provided with the searched property names and values. In case of numerical values we can provide a range
        of searched values by providing op1 and op2 properties as described in the example. Optional root fields
        minimumScore (>= 0) and minimumClassification may be included to filter by quality assessment results.
      properties:
        catalogueIds:
          type: array
          items:
            type: string
          description: An array of catalogue ids to search. If no Ids provided no catalogue will be searched.
      required:
        - catalogueIds
      example:
        minimumScore: 75
        minimumClassification: good
        catalogueIds:
        - catalogue_id1
        - catalogue_id2
        - catalogue_id3
        simpl:OfferingPrice:
          price:
            op1: '>='
            value1: '15'
            op2: <
            value2: '150'
        simpl:GeneralServiceProperties:
          name: asset002
        simpl:ContractTemplate:
          contractTemplateDocument: Contract Template 1234
  headers:
    federatedCorrelationId:
      description: The Correlation-Id from the forwarded request, echoed only in the response header.
      required: true
      schema:
        type: string
      example: 123e4567-e89b-12d3-a456-426614174000
    federatedOptionalCorrelationId:
      description: Echoed when the malformed request included a Correlation-Id; absent if that required header was missing.
      required: false
      schema:
        type: string
      example: 123e4567-e89b-12d3-a456-426614174000
  responses:
    federatedResourceDescriptionResponse:
      description: Complete resource description; no separate schema is returned.
      headers:
        Correlation-Id:
          $ref: '#/components/headers/federatedCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/federatedResourceDescriptionPayload'
          examples:
            returnValidResponse:
              value:
                resourceDescription:
                  '@context':
                  - https://www.w3.org/2018/credentials/v1
                  - https://w3id.org/security/suites/jws-2020/v1
                  credentialSubject:
                    '@context':
                      dct: http://purl.org/dc/terms/
                      rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
                      simpl: http://w3id.org/gaia-x/simpl#
                    '@id': did:web:registry.gaia-x.eu:DataOffering:fMw2UtNCDW-ydI83YKscqCKa-n75jJ0qY7v0
                    rdf:type:
                      '@id': simpl:DataOffering
                    dct:conformsTo:
                      '@id': https://simpl.example.org/schema/DataSchema
                      '@type': dct:Standard
                      dct:hasVersion: '21'
                      dct:schemaName: DataSchema
                    simpl:generalServiceProperties:
                      rdf:type:
                        '@id': simpl:GeneralServiceProperties
                      simpl:name: Example dataset
                      simpl:description: Sample dataset for federated discovery
                      simpl:inLanguage: en
                      simpl:offeringType: data
                      simpl:serviceAccessPoint:
                        '@type': http://www.w3.org/2001/XMLSchema#anyURI
                        '@value': https://provider.example.org/data
                    simpl:dataProperties:
                      rdf:type:
                        '@id': simpl:DataProperties
                      simpl:format: text/csv
                    simpl:providerInformation:
                      rdf:type:
                        '@id': simpl:ProviderInformation
                      simpl:providedBy: did:web:provider.example.org
                  issuanceDate: '2026-01-15T10:00:00Z'
                  issuer: did:web:authority.example.org
                  type: VerifiableCredential
                  proof:
                    type: JsonWebSignature2020
                    created: '2026-01-15T10:00:00Z'
                    proofPurpose: assertionMethod
                    verificationMethod: did:web:authority.example.org#key-1
                    jws: illustrative-signature
    federatedBadRequestResponse:
      description: Malformed or missing required path/forwarded header parameters reaching the adapter.
      headers:
        Correlation-Id:
          $ref: '#/components/headers/federatedOptionalCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:belgif:badRequest
            title: Bad Request
            status: 400
            detail: Required forwarded header User-Attributes is missing.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    federatedNotFoundResponse:
      description: The requested resource description does not exist in the Federated Catalogue.
      headers:
        Correlation-Id:
          $ref: '#/components/headers/federatedCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:notFound
            title: Not Found
            status: 404
            detail: Resource description with the requested identifier was not found.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    federatedNotAcceptableResponse:
      description: The requested Accept media types cannot be produced by the adapter.
      headers:
        Correlation-Id:
          $ref: '#/components/headers/federatedCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:notAcceptable
            title: Not Acceptable
            status: 406
            detail: The requested response media type is not supported; use application/json.
            instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    federatedInternalServerErrorResponse:
      description: >-
        A downstream catalogue request failed or another internal failure occurred.
      headers:
        Correlation-Id:
          $ref: '#/components/headers/federatedCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            returnInternalServerError:
              value:
                type: urn:problem-type:simpl:internalServerError
                title: Internal Server Error
                status: 500
                detail: The resource description could not be retrieved due to a downstream failure.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    internalServerErrorResponse:
      description: Internal Server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            returnInternalServerError:
              value:
                type: urn:problem-type:simpl:internalServerError
                href: https://www.belgif.be/specification/rest/api-guide/problems/internalServerError.html
                title: Internal Server Error
                status: 500
                detail: Internal Server Error
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    notFoundErrorResponse:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:notFound
            href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/404
            title: Not Found
            status: 404
            detail: Resource with given id was not found.
            instance: urn:uuid:8795ff62-63f3-4474-912f-567f88ce2304
    forbiddenErrorResponse:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:forbidden
            href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/403
            title: Forbidden
            status: 403
            detail: Client is not authorized to access the requested resource.
            instance: urn:uuid:24a550c4-d7a8-4c06-91aa-35a80244776e
    unauthorizedErrorResponse:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:problem-type:simpl:unauthorized
            href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/401
            title: Invalid or expired token
            status: 401
            detail: Invalid or expired token
            instance: urn:uuid:24a550c4-d7a8-4c06-91aa-35a80244776e
