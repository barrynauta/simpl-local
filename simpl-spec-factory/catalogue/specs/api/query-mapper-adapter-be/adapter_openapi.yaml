  /federated/resourceDescriptions/{resourceDescriptionId}:
    $ref: ./tier2-gateway/t2-adapter-openapi.yaml#/paths/~1federated~1resourceDescriptions~1{resourceDescriptionId}
  /selfDescriptions:
    $ref: ./tier2-gateway/t2-adapter-openapi.yaml#/paths/~1selfDescriptions
  /selfDescriptions/advancedSearch:
