                    href: https://www.belgif.be/specification/rest/api-guide/problems/internalServerError.html
                    title: Internal Server Error
                    status: 500
                    detail: Internal Server Error
                    instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
  /federated/resourceDescriptions/{resourceDescriptionId}:
    get:
      tags:
      - Federated resource description
      operationId: getFederatedResourceDescription
      summary: Retrieve a federated resource description
      description: The Trustor Governance Authority receives this request from a Trusted
        Governance Authority. The gateway authenticates the Trusted Governance Authority
        using mutual TLS, maps the Consumer's identity attributes, and evaluates discovery
        ABAC before forwarding this request. The gateway supplies User-Attributes
        and Correlation-Id to the adapter. The adapter does not repeat gateway authorization
        or require OAuth2 for this operation. Gateway-generated authentication and
        ABAC errors are outside this adapter response contract. The response contains
        the complete resource description, but does not return a separate schema.
      security: []
      parameters:
      - name: resourceDescriptionId
        in: path
        required: true
        description: Identifier of the resource description in the Federated Catalogue.
        schema:
          type: string
          minLength: 1
        example: did:web:registry.gaia-x.eu:DataOffering:fMw2UtNCDW-ydI83YKscqCKa-n75jJ0qY7v0
      - name: User-Attributes
        in: header
        required: true
        description: Consumer identity attributes forwarded by the gateway after discovery
          ABAC.
        schema:
          type: string
          minLength: 1
        example: CONSUMER
      - name: Correlation-Id
        in: header
        required: true
        description: Request correlation identifier forwarded by the gateway; echoed
          in the response header only.
        schema:
          type: string
          minLength: 1
        example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Complete resource description; no separate schema is returned.
          headers:
            Correlation-Id:
              description: The Correlation-Id from the forwarded request, echoed only
                in the response header.
              required: true
              schema:
                type: string
              example: 123e4567-e89b-12d3-a456-426614174000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/federatedResourceDescriptionPayload'
              examples:
                returnValidResponse:
                  value:
                    resourceDescription:
                      '@context':
                      - https://www.w3.org/2018/credentials/v1
                      - https://w3id.org/security/suites/jws-2020/v1
                      credentialSubject:
                        '@context':
                          dct: http://purl.org/dc/terms/
                          rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
                          simpl: http://w3id.org/gaia-x/simpl#
                        '@id': did:web:registry.gaia-x.eu:DataOffering:fMw2UtNCDW-ydI83YKscqCKa-n75jJ0qY7v0
                        rdf:type:
                          '@id': simpl:DataOffering
                        dct:conformsTo:
                          '@id': https://simpl.example.org/schema/DataSchema
                          '@type': dct:Standard
                          dct:hasVersion: '21'
                          dct:schemaName: DataSchema
                        simpl:generalServiceProperties:
                          rdf:type:
                            '@id': simpl:GeneralServiceProperties
                          simpl:name: Example dataset
                          simpl:description: Sample dataset for federated discovery
                          simpl:inLanguage: en
                          simpl:offeringType: data
                          simpl:serviceAccessPoint:
                            '@type': http://www.w3.org/2001/XMLSchema#anyURI
                            '@value': https://provider.example.org/data
                        simpl:dataProperties:
                          rdf:type:
                            '@id': simpl:DataProperties
                          simpl:format: text/csv
                        simpl:providerInformation:
                          rdf:type:
                            '@id': simpl:ProviderInformation
                          simpl:providedBy: did:web:provider.example.org
                      issuanceDate: '2026-01-15T10:00:00Z'
                      issuer: did:web:authority.example.org
                      type: VerifiableCredential
                      proof:
                        type: JsonWebSignature2020
                        created: '2026-01-15T10:00:00Z'
                        proofPurpose: assertionMethod
                        verificationMethod: did:web:authority.example.org#key-1
                        jws: illustrative-signature
        '400':
          description: Malformed or missing required path/forwarded header parameters
            reaching the adapter.
          headers:
            Correlation-Id:
              description: Echoed when the malformed request included a Correlation-Id;
                absent if that required header was missing.
              required: false
              schema:
                type: string
              example: 123e4567-e89b-12d3-a456-426614174000
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:belgif:badRequest
                title: Bad Request
                status: 400
                detail: Required forwarded header User-Attributes is missing.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '404':
          description: The requested resource description does not exist in the Federated
            Catalogue.
          headers:
            Correlation-Id:
              description: The Correlation-Id from the forwarded request, echoed only
                in the response header.
              required: true
              schema:
                type: string
              example: 123e4567-e89b-12d3-a456-426614174000
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notFound
                title: Not Found
                status: 404
                detail: Resource description with the requested identifier was not
                  found.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '406':
          description: The requested Accept media types cannot be produced by the
            adapter.
          headers:
            Correlation-Id:
              description: The Correlation-Id from the forwarded request, echoed only
                in the response header.
              required: true
              schema:
                type: string
              example: 123e4567-e89b-12d3-a456-426614174000
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                title: Not Acceptable
                status: 406
                detail: The requested response media type is not supported; use application/json.
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
          description: A downstream catalogue request failed or another internal failure
            occurred.
          headers:
            Correlation-Id:
              description: The Correlation-Id from the forwarded request, echoed only
                in the response header.
              required: true
              schema:
                type: string
              example: 123e4567-e89b-12d3-a456-426614174000
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnInternalServerError:
                  value:
                    type: urn:problem-type:simpl:internalServerError
                    title: Internal Server Error
                    status: 500
                    detail: The resource description could not be retrieved due to
                      a downstream failure.
                    instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
  /selfDescriptions:
    get:
      tags:
      - Resource description search
      operationId: searchSelfDescriptions
      summary: Search the Federated Catalogue for Resource descriptions that contain
        the provided keyword. Resource descriptions with access policy values other
        than the one defined in the Client access token will not be listed
      parameters:
      - name: searchString
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?=.*\S)[\p{L}\p{N}\s.,'\-_&@()+/]{1,255}$
        description: String value against which the search will be conducted. Must
          not be blank, must not exceed 255 characters, and may only contain letters,
          numbers, whitespace, dots, commas, apostrophes, hyphens, underscores, ampersands,
          at signs, parentheses, plus signs, and slashes.
        examples:
          returnValidResponse:
            value: asset03
      - name: minimumScore
        in: query
        required: false
        schema:
          type: number
          format: double
        description: Optional. Minimum overall quality score. Must be >= 0.
      - name: minimumClassification
        in: query
        required: false
        schema:
          type: string
        description: Optional. Minimum overall quality classification from the active
          MQP.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (1-based). Must be greater than 0.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Number of items per page. Must be greater than 0. Values above
          100 are silently capped at 100.
      - name: User-Attributes
        in: header
        required: false
        schema:
          type: string
        description: Optional user attributes header
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchResponsePayload'
              examples:
                returnValidResponse:
                  value:
                    totalCount: 2
                    items:
                    - n:
                        claimsGraphUri:
                        - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                        offeringType: infrastructure
                        name: text title for infrastructure resource.
                        inLanguage: da
                        description: text description
                        serviceAccessPoint: http://serviceaccesspoint.com
                        overallScore: 0.92
                        overallClassification: Green
                    - n:
                        claimsGraphUri:
                        - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
                        offeringType: data
                        name: asset03
                        description: asset description
                        inLanguage: en
                        serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
                        overallScore: null
                        overallClassification: null
                    page: 1
                    pageSize: 20
                    total: 2
                    totalPages: 1
                    next: null
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnBadRequestInvalidSearchString:
                  value:
                    type: urn:problem-type:belgif:badRequest
                    href: https://www.belgif.be/specification/rest/api-guide/problems/badRequest.html
                    title: Bad Request
                    status: 400
                    detail: Query parameter 'searchString' contains invalid characters.
                    instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
                returnBadRequestInvalidMinimumScore:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumScore must be greater than or equal to 0.
                returnBadRequestInvalidMinimumClassification:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumClassification is not a supported quality classification
                      value.
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: urn:problem-type:simpl:notAcceptable
                href: https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/406
                title: Not Acceptable
                status: 406
                detail: Server cannot produce a response matching the list of acceptable
                  values defined in the request's
                instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
          description: Internal Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnInternalServerError:
                  value:
                    type: urn:problem-type:simpl:internalServerError
                    href: https://www.belgif.be/specification/rest/api-guide/problems/internalServerError.html
                    title: Internal Server Error
                    status: 500
                    detail: Internal Server Error
                    instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
  /selfDescriptions/advancedSearch:
    post:
      x-microcks-operation:
        dispatcher: SCRIPT
        dispatcherRules: "def jsonSlurper = new groovy.json.JsonSlurper()\ndef requestBody\
          \ = jsonSlurper.parseText(mockRequest.getRequestContent())\ndef contractTemplateNode\
          \ = requestBody?.\"simpl:ContractTemplate\"\ndef priceObject = requestBody?.\"\
          simpl:OfferingPrice\"?.price\nif (contractTemplateNode != null && contractTemplateNode.findAll().size()\
          \ == 0) {\n  return \"returnBadRequestEmptyNodeDefinition\"\n}\nif (priceObject\
          \ != null && priceObject.customOperator != null) {\n  return \"returnBadRequestWrongPropertyNamesForPriceField\"\
          \n}\nreturn \"returnValidResponse\"\n"
