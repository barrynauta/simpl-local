      - Resource description search
      operationId: advancedSearchSelfDescriptions
      summary: Search the Federated Catalogue for Resource descriptions that match
        the provided search criteria in the request payload. Resource descriptions
        with access policy values other than the one defined in the Client access
        token will not be listed
      parameters:
      - name: User-Attributes
        in: header
        required: false
        schema:
          type: string
        description: Optional user attributes header
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (1-based). Must be greater than 0.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Number of items per page. Must be greater than 0. Values above
