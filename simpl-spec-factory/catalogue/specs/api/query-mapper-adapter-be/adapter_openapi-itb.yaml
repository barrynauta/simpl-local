components:
  schemas:
    Problem:
      description: 'A Problem Details object (RFC 9457).


        Additional properties specific to the problem type may be present.

        '
      type: object
      properties:
        type:
          type: string
          format: uri
          pattern: ^[A-Za-z][A-Za-z0-9+.-]*:[^\s]+$
          description: An absolute URI that identifies the problem type
          default: about:blank
        href:
          type: string
          format: uri
          description: An absolute URI that, when dereferenced, provides human-readable
            documentation for the problem type (e.g. using HTML).
        title:
          type: string
          description: A short summary of the problem type. Written in English and
            readable for engineers (usually not suited for non technical stakeholders
            and not localized).
          example: Service Unavailable
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this
            occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 503
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem
        instance:
          type: string
          format: uri
          description: An absolute URI that identifies the specific occurrence of
            the problem. It may or may not yield further information if dereferenced.
      example:
        type: urn:problem-type:exampleOrganization:exampleProblem
        href: https://www.belgif.be/specification/rest/api-guide/#standardized-problem-types
        title: Description of the type of problem that occurred
        status: 400
        detail: Description of specific occurrence of the problem
        instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
    searchResponsePayload:
      type: object
      required:
      - totalCount
      - items
      - page
      - pageSize
      - total
      - totalPages
      - next
      properties:
        totalCount:
          type: integer
          example: 2
          description: Number of found Resource description.
        items:
          type: array
          items:
            type: object
            properties:
              n:
                type: object
                properties:
                  claimsGraphUri:
                    type: array
                    items:
                      type: string
                  offeringType:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
                  inLanguage:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  serviceAccessPoint:
                    type: string
                    nullable: true
                  overallScore:
                    type: number
                    format: double
                    nullable: true
                    description: Overall quality score from the active resource description
                      quality assessment result.
                  overallClassification:
                    type: string
                    nullable: true
                    description: Overall quality classification from the active resource
                      description quality assessment result.
          example:
          - n:
              claimsGraphUri:
              - did:web:registry.gaia-x.eu:InfrastructureOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
              offeringType: infrastructure
              name: text title for infrastructure resource.
              inLanguage: da
              description: text description
              serviceAccessPoint: http://serviceaccesspoint.com
              overallScore: 0.92
              overallClassification: Green
          - n:
              claimsGraphUri:
              - did:web:registry.gaia-x.eu:DataOffering:3mwO1pOqDQ_fID9jc9Az1TS5JKIS_oinfKHF_TEST_235
              offeringType: data
              name: asset 004
              description: asset description
              inLanguage: en
              serviceAccessPoint: https://sd-ui.dev.simpl-europe.eu
              overallScore: null
              overallClassification: null
          description: An array of general service properties nodes of a filtered
            out resource descriptions
        page:
          type: integer
          example: 1
          description: Current 1-based page number.
        pageSize:
          type: integer
          example: 20
          description: Effective number of items per page, capped at 100.
        total:
          type: integer
          example: 150
          description: Total number of items across all pages.
        totalPages:
          type: integer
          example: 8
          description: Total number of pages.
        next:
          type: string
          nullable: true
          example: /selfDescriptions?searchString=test&page=2&pageSize=20
          description: Relative URL to the next page, or null when no next page is
            available. Advanced-search clients must resend the same POST body to the
            URL returned for that operation.
    versionHistoryResponsePayload:
      type: object
      properties:
        totalCount:
          type: integer
          example: 2
          description: Number of found version entries.
        items:
          type: array
          items:
            type: object
            properties:
              n:
                type: object
                properties:
                  claimsGraphUri:
                    type: array
                    items:
                      type: string
                  offeringType:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
                  inLanguage:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
                  serviceAccessPoint:
                    type: string
                    nullable: true
                  version:
                    type: integer
                    nullable: true
          description: An array of version history items with mapped resource description
            properties
    advancedSearchRequestPayload:
      type: object
      description: Since resource descriptions as of now are schemaless the request
        body can be any JSON with proper structure. Each JSON root key needs to correspond
        to a resource description node name. As a value for that key an JSON object
        need to be provided with the searched property names and values. In case of
        numerical values we can provide a range of searched values by providing op1
        and op2 properties as described in the example. Optional root fields minimumScore
        (>= 0) and minimumClassification may be included to filter by quality assessment
        results.
      properties:
        catalogueIds:
          type: array
          items:
            type: string
          description: An array of catalogue ids to search. If no Ids provided no
            catalogue will be searched.
      required:
      - catalogueIds
      example:
        minimumScore: 75
        minimumClassification: good
        catalogueIds:
        - catalogue_id1
        - catalogue_id2
        - catalogue_id3
        simpl:OfferingPrice:
          price:
            op1: '>='
            value1: '15'
            op2: <
            value2: '150'
        simpl:GeneralServiceProperties:
          name: asset002
        simpl:ContractTemplate:
          contractTemplateDocument: Contract Template 1234
    federatedResourceDescriptionPayload:
      type: object
      description: Full resource description returned without a separate schema.
      additionalProperties: false
      required:
      - resourceDescription
      properties:
        resourceDescription:
          type: object
          description: Complete Federated Catalogue resource description (including
            its credentialSubject and dct:conformsTo); the JSON-LD properties vary
            by offering type and are not truncated or projected.
          additionalProperties: true
  responses:
    internalServerErrorResponse:
      description: Internal Server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            returnInternalServerError:
