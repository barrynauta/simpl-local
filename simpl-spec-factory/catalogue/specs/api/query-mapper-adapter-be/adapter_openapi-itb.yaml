paths:
  /governanceAuthority/selfDescriptions:
    get:
      tags:
      - Governance Authority resource description search
      operationId: searchGovernanceAuthoritySelfDescriptions
      summary: Quick search across selected catalogues through the Trusted Governance
        Authority.
      description: A Consumer supplies catalogue identifiers and quick-search criteria
        to its Trusted Governance Authority. Unlike local GET /selfDescriptions, this
        contract requires an explicit non-empty catalogue selection. The Trusted Governance
        Authority delegates searches at selected Trustor catalogues through the separate
        SIMPL-31880 API. This specification-only contract does not define orchestration,
        result aggregation, or partial-failure rules.
      parameters:
      - name: catalogueIds
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        description: Identifiers of the Consumer-selected catalogues, not caller-supplied
          endpoint URLs. Repeat the query parameter for multiple selections, for example
          catalogueIds=climateResearchCatalogue&catalogueIds=transportDataCatalogue.
          Missing selection, an empty selection, or an empty identifier is invalid.
        examples:
          singleCatalogue:
            summary: Select the climate research catalogue.
            value:
            - climateResearchCatalogue
          multipleCatalogues:
            summary: Select the climate research and transport data catalogues.
            value:
            - climateResearchCatalogue
            - transportDataCatalogue
      - name: searchString
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^(?=.*\S)[\p{L}\p{N}\s.,'\-_&@()+/]{1,255}$
        description: String value against which the search will be conducted. Must
          not be blank, must not exceed 255 characters, and may only contain letters,
          numbers, whitespace, dots, commas, apostrophes, hyphens, underscores, ampersands,
          at signs, parentheses, plus signs, and slashes.
        examples:
          returnValidResponse:
            value: climate
      - name: minimumScore
        in: query
        required: false
        schema:
          type: number
          format: double
          minimum: 0
        description: Optional. Minimum overall quality score. Must be >= 0.
        examples:
          qualityThreshold:
            value: 0.8
      - name: minimumClassification
        in: query
        required: false
        schema:
          type: string
        description: Optional. Minimum overall quality classification from the active
          MQP.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (1-based). Must be greater than 0.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Number of items per page. Must be greater than 0. Values above
          100 are silently capped at 100.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchResponsePayload'
              examples:
                returnValidResponse:
                  value:
                    totalCount: 2
                    items:
                    - n:
                        claimsGraphUri:
                        - did:web:climate.example.org:DataOffering:a94ef06c-a12d-4308-89aa-fffcd8a61126
                        offeringType: data
                        name: European climate observations
                        inLanguage: en
                        description: Daily temperature and precipitation observations
                          from European stations.
                        serviceAccessPoint: https://climate.example.org/datasets/observations
                        overallScore: 0.92
                        overallClassification: Green
                    - n:
                        claimsGraphUri:
                        - did:web:transport.example.org:DataOffering:72c5190c-265d-4c90-985e-f23877314a88
                        offeringType: data
                        name: Climate impact on regional transport
                        description: Regional transport disruptions associated with
                          extreme weather.
                        inLanguage: en
                        serviceAccessPoint: https://transport.example.org/datasets/climate-impact
                        overallScore: null
                        overallClassification: null
                    page: 1
                    pageSize: 20
                    total: 2
                    totalPages: 1
                    next: null
                returnEmptyResponse:
                  summary: No resource descriptions match the criteria in the selected
                    catalogues.
                  value:
                    totalCount: 0
                    items: []
                    page: 1
                    pageSize: 20
                    total: 0
                    totalPages: 0
                    next: null
        '400':
          description: Invalid or missing catalogue selection, search criteria, or
            pagination.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnBadRequestMissingCatalogueIds:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: Required query parameter 'catalogueIds' is missing; select
                      at least one catalogue.
                returnBadRequestEmptyCatalogueIds:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: catalogueIds must contain at least one catalogue identifier.
                returnBadRequestEmptyCatalogueId:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: Each catalogueIds value must be a non-empty string.
                returnBadRequestInvalidSearchString:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: searchString is required, must not be blank, must be at
                      most 255 characters, and must contain only permitted characters.
                    instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
                returnBadRequestInvalidMinimumScore:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumScore must be greater than or equal to 0.
                returnBadRequestInvalidMinimumClassification:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: minimumClassification is not a supported quality classification
                      value.
                returnBadRequestInvalidPagination:
                  value:
                    type: urn:problem-type:simpl:catalogue:invalidInput
                    title: Invalid input
                    status: 400
                    detail: page and pageSize must be integers greater than 0.
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                returnNotAcceptable:
                  value:
                    type: urn:problem-type:simpl:notAcceptable
                    title: Not Acceptable
                    status: 406
                    detail: The requested response media type is not supported; use
                      application/json.
                    instance: urn:uuid:123e4567-e89b-12d3-a456-426614174000
        '500':
