  /contractClauses/documents/{documentId}:
    get:
      tags:
      - Contract Clauses
      summary: Returns a contract clause document based on its identifier
      description: Returns the binary content of the contract clause document identified by the provided documentId as a stream, together with the appropriate content type header.
      operationId: getDocument
      parameters:
      - name: documentId
        in: path
        description: The unique identifier of the document to download.
        required: true
        schema:
          type: string
          description: The unique identifier of the document to download.
          example: 4727baa4-8c7b-4e7f-90ba-eebe460c0408
        example: 4727baa4-8c7b-4e7f-90ba-eebe460c0408
      responses:
        "200":
          description: Document successfully retrieved
          headers:
            Content-Length:
              description: Size of the document, in bytes
              style: simple
              schema:
                type: integer
                format: int64
                example: 204800
            Content-Type:
              description: Indicates the MIME type of the returned document
              style: simple
              schema:
                type: string
                example: application/pdf
          content:
            application/pdf:
              schema:
                type: string
                description: The binary content of the PDF document
                format: binary
              examples:
                Sample contract clause document:
                  summary: Example PDF document
                  description: A sample contract clause document, provided as an external binary reference since binary content cannot be represented inline
                  externalValue: https://files.dev.simpl-europe.eu/static/contract/ContractTemplate1.pdf
        "404":
          description: Document not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
              example:
                type: urn:problem-type:simpl:notFound
                title: Document not found
                status: 404
                detail: Document with identifier '4727baa4-8c7b-4e7f-90ba-eebe460c0408' was not found
                instance: /contractClauses/documents/{documentId}
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorProblem'
              example:
                type: urn:problem-type:simpl:internalServerError
                title: Internal Server Error
                status: 500
                instance: /contractClauses/documents/{documentId}
                detail: Unexpected internal error
