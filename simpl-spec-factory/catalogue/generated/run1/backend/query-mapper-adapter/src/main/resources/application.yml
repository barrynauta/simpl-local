server:
  port: ${PORT:8000}
spring:
  application:
    name: query-mapper-adapter
  mvc:
    problemdetails:
      enabled: false
simpl:
  security:
    issuer-base: ${ISSUER_BASE:http://localhost:18080/realms/}
    jwks-base: ${JWKS_BASE:http://keycloak:8080/realms/}
    own-realm: ${OWN_REALM:dataspace-a}
    federation-realms: ${FEDERATION_REALMS:dataspace-a,dataspace-b,dataspace-c}
    federation-paths: /v1/federated/
  qma:
    cat-url: ${CAT_URL:http://cat-a:8000}
    federation-file: ${FEDERATION_FILE:/config/federation.json}
