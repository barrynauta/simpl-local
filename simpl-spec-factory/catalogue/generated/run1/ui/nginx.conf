server {
  listen 8000;
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    default_type application/json;
    return 200 '{"status":"UP"}';
  }

  # Section 5.1: the UI proxies the API to cbe-a (same origin for the browser).
  location /api/v1/ {
    proxy_pass http://cbe-a:8000/v1/;
    proxy_read_timeout 60s;
  }
  location /api/v2/ {
    proxy_pass http://cbe-a:8000/v2/;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
