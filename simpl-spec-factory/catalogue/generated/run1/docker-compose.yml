# Simpl-Open Catalogue, spec factory build.
# Start: docker compose -p simpl-catalogue-factory up -d --build --wait
name: simpl-catalogue-factory

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

x-backend-env: &backend-env
  ISSUER_BASE: http://localhost:18080/realms/
  JWKS_BASE: http://keycloak:8080/realms/

x-depends-keycloak: &depends-keycloak
  keycloak:
    condition: service_healthy

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:18080
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./env/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  catalogue-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue
      POSTGRES_DB: postgres
    volumes:
      - ./env/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d cat_b"]
      interval: 3s
      timeout: 3s
      retries: 40

  schema-stub:
    build: ./stubs/schema-stub
    volumes:
      - ./env/seed/schemas:/seed/schemas:ro
    ports:
      - "18401:8000"

  quality-stub:
    build: ./stubs/quality-stub
    ports:
      - "18402:8000"

  cat-a:
    build:
      <<: *backend-build
      args:
        MODULE: catalogue-be
    environment:
      <<: *backend-env
      OWN_REALM: dataspace-a
      DB_URL: jdbc:postgresql://catalogue-db:5432/cat_a
      KEY_REGISTRY: /config/participant-keys.json
      QUALITY_STUB_URL: http://quality-stub:8000
    volumes:
      - ./env/seed:/seed:ro
      - ./env/keys/participant-keys-a.json:/config/participant-keys.json:ro
    ports:
      - "18101:8000"
    depends_on:
      <<: *depends-keycloak
      catalogue-db:
        condition: service_healthy
      quality-stub:
        condition: service_healthy

  cat-b:
    build:
      <<: *backend-build
      args:
        MODULE: catalogue-be
    environment:
      <<: *backend-env
      OWN_REALM: dataspace-b
      DB_URL: jdbc:postgresql://catalogue-db:5432/cat_b
      KEY_REGISTRY: /config/participant-keys.json
      QUALITY_STUB_URL: http://quality-stub:8000
    volumes:
      - ./env/seed:/seed:ro
      - ./env/keys/participant-keys-b.json:/config/participant-keys.json:ro
    ports:
      - "18201:8000"
    depends_on:
      <<: *depends-keycloak
      catalogue-db:
        condition: service_healthy
      quality-stub:
        condition: service_healthy

  qma-a:
    build:
      <<: *backend-build
      args:
        MODULE: query-mapper-adapter
    environment:
      <<: *backend-env
      OWN_REALM: dataspace-a
      CAT_URL: http://cat-a:8000
      FEDERATION_FILE: /config/federation.json
    volumes:
      - ./env/federation/federation-a.json:/config/federation.json:ro
    ports:
      - "18102:8000"
    depends_on:
      <<: *depends-keycloak
      cat-a:
        condition: service_healthy

  qma-b:
    build:
      <<: *backend-build
      args:
        MODULE: query-mapper-adapter
    environment:
      <<: *backend-env
      OWN_REALM: dataspace-b
      CAT_URL: http://cat-b:8000
      FEDERATION_FILE: /config/federation.json
    volumes:
      - ./env/federation/federation-b.json:/config/federation.json:ro
    ports:
      - "18202:8000"
    depends_on:
      <<: *depends-keycloak
      cat-b:
        condition: service_healthy

  qma-c:
    build:
      <<: *backend-build
      args:
        MODULE: query-mapper-adapter
    environment:
      <<: *backend-env
      OWN_REALM: dataspace-c
      CAT_URL: http://cat-c.invalid:8000
      FEDERATION_FILE: /config/federation.json
    volumes:
      - ./env/federation/federation-c.json:/config/federation.json:ro
    ports:
      - "18302:8000"
    depends_on:
      <<: *depends-keycloak

  cbe-a:
    build:
      <<: *backend-build
      args:
        MODULE: catalogue-client-be
    environment:
      <<: *backend-env
      OWN_REALM: dataspace-a
      QMA_URL: http://qma-a:8000/v1
      CAT_URL: http://cat-a:8000
      SCHEMA_STUB_URL: http://schema-stub:8000
      QUALITY_STUB_URL: http://quality-stub:8000
      FEDERATION_FILE: /config/federation.json
    volumes:
      - ./env/federation/federation-a.json:/config/federation.json:ro
    ports:
      - "18103:8000"
    depends_on:
      <<: *depends-keycloak
      qma-a:
        condition: service_healthy
      schema-stub:
        condition: service_healthy

  ui-a:
    build: ./ui
    ports:
      - "18104:8000"
    depends_on:
      cbe-a:
        condition: service_healthy
