<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker>
    <marker id="brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker>
  </defs>
  <rect width="1000" height="860" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Catalogue swap test: each joint crossed on its own</text>

  <!-- column headers -->
  <text x="300" y="72" text-anchor="middle" font-weight="bold" fill="#475569">Existing (upstream, May 2026)</text>
  <text x="700" y="72" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Generated (run 1), data space A</text>

  <!-- suites -->
  <rect x="170" y="86" width="660" height="34" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="500" y="108" text-anchor="middle" fill="#713f12">Black-box suite over every combination: 459 API and 26 UI scenarios (behave, Playwright)</text>
  <line x1="300" y1="120" x2="300" y2="148" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>
  <line x1="700" y1="120" x2="700" y2="148" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>

  <!-- row 1: UIs -->
  <rect x="200" y="150" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="176" text-anchor="middle" font-weight="bold" fill="#1f2937">Existing UI</text>
  <text x="300" y="196" text-anchor="middle" font-size="12" fill="#4b5563">Astro, server-side API routes</text>
  <rect x="600" y="150" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="176" text-anchor="middle" font-weight="bold" fill="#1f2937">Generated UI</text>
  <text x="700" y="196" text-anchor="middle" font-size="12" fill="#4b5563">Vue 3, nginx</text>

  <!-- Keycloak -->
  <rect x="850" y="150" width="136" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="918" y="176" text-anchor="middle" font-weight="bold" fill="#1f2937">Keycloak</text>
  <text x="918" y="196" text-anchor="middle" font-size="12" fill="#4b5563">realms A, B, C</text>
  <line x1="802" y1="180" x2="848" y2="180" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- row 2: client backends -->
  <rect x="200" y="260" width="200" height="60" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="286" text-anchor="middle" font-weight="bold" fill="#6b7280">No client back-end</text>
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#6b7280">not in the May 2026 stack</text>
  <rect x="600" y="260" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="286" text-anchor="middle" font-weight="bold" fill="#1f2937">Client back-end</text>
  <text x="700" y="306" text-anchor="middle" font-size="12" fill="#4b5563">grouped results, /v1 and /v2</text>

  <!-- row 3: adapters -->
  <rect x="200" y="370" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="396" text-anchor="middle" font-weight="bold" fill="#1f2937">Query mapper adapter</text>
  <text x="300" y="416" text-anchor="middle" font-size="12" fill="#4b5563">Spring Boot, /v1</text>
  <rect x="600" y="370" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="396" text-anchor="middle" font-weight="bold" fill="#1f2937">Query mapper adapter</text>
  <text x="700" y="416" text-anchor="middle" font-size="12" fill="#4b5563">Spring Boot, federation</text>

  <!-- data spaces B and C -->
  <rect x="850" y="370" width="136" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="4 3"/>
  <text x="918" y="396" text-anchor="middle" font-weight="bold" fill="#1f2937">Data spaces B, C</text>
  <text x="918" y="416" text-anchor="middle" font-size="12" fill="#4b5563">adapter, catalogue</text>
  <line x1="802" y1="400" x2="848" y2="400" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- row 4: catalogue backends -->
  <rect x="200" y="480" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="506" text-anchor="middle" font-weight="bold" fill="#1f2937">Catalogue back-end</text>
  <text x="300" y="526" text-anchor="middle" font-size="12" fill="#4b5563">XFSC fc-service</text>
  <rect x="600" y="480" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="506" text-anchor="middle" font-weight="bold" fill="#1f2937">Catalogue back-end</text>
  <text x="700" y="526" text-anchor="middle" font-size="12" fill="#4b5563">signatures, SHACL, quality</text>

  <!-- stubs -->
  <rect x="850" y="480" width="136" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="918" y="506" text-anchor="middle" font-weight="bold" fill="#1f2937">Stubs</text>
  <text x="918" y="526" text-anchor="middle" font-size="12" fill="#4b5563">schemas, quality</text>
  <line x1="802" y1="510" x2="848" y2="510" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- row 5: stores -->
  <rect x="200" y="590" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="616" text-anchor="middle" font-weight="bold" fill="#1f2937">Neo4j and PostgreSQL</text>
  <text x="300" y="636" text-anchor="middle" font-size="12" fill="#4b5563">graph, metadata</text>
  <rect x="600" y="590" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="616" text-anchor="middle" font-weight="bold" fill="#1f2937">PostgreSQL</text>
  <text x="700" y="636" text-anchor="middle" font-size="12" fill="#4b5563">one database per catalogue</text>

  <!-- own pairing, upstream: UI calls the adapter (search) and the catalogue (detail) -->
  <polyline points="215,210 215,368" fill="none" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <polyline points="200,190 178,190 178,510 198,510" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#grey)"/>
  <text x="170" y="350" text-anchor="end" font-size="12" fill="#4b5563">detail</text>
  <line x1="300" y1="430" x2="300" y2="478" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="300" y1="540" x2="300" y2="588" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>

  <!-- own pairing, generated -->
  <line x1="700" y1="210" x2="700" y2="258" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="700" y1="320" x2="700" y2="368" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="700" y1="430" x2="700" y2="478" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="700" y1="540" x2="700" y2="588" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>

  <!-- D: existing UI on the generated adapter and catalogue -->
  <line x1="400" y1="196" x2="598" y2="372" stroke="#db2777" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#pink)"/>
  <circle cx="455" cy="245" r="12" fill="#db2777"/><text x="455" y="250" text-anchor="middle" font-weight="bold" fill="#ffffff">D</text>

  <!-- B and C: generated client back-end on the existing adapter -->
  <line x1="600" y1="300" x2="402" y2="384" stroke="#059669" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#green)"/>
  <rect x="527" y="311" width="38" height="24" rx="12" fill="#059669"/><text x="546" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">B C</text>

  <!-- A: generated adapter on the existing catalogue -->
  <line x1="600" y1="420" x2="402" y2="496" stroke="#d97706" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#orange)"/>
  <circle cx="545" cy="441" r="12" fill="#d97706"/><text x="545" y="446" text-anchor="middle" font-weight="bold" fill="#ffffff">A</text>

  <!-- E: existing adapter on the generated catalogue -->
  <line x1="400" y1="420" x2="598" y2="496" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#purple)"/>
  <circle cx="455" cy="455" r="12" fill="#7c3aed"/><text x="455" y="460" text-anchor="middle" font-weight="bold" fill="#ffffff">E</text>

  <!-- legend -->
  <line x1="16" y1="680" x2="984" y2="680" stroke="#e5e7eb"/>
  <line x1="24" y1="706" x2="64" y2="706" stroke="#6b7280" stroke-width="2.5"/>
  <text x="74" y="711" fill="#1f2937">Own pairing: each side on its own parts</text>
  <circle cx="44" cy="736" r="10" fill="#d97706"/><text x="44" y="741" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">A</text>
  <text x="74" y="741" fill="#1f2937">Generated adapter on the existing catalogue: 39 of 63</text>
  <circle cx="44" cy="766" r="10" fill="#7c3aed"/><text x="44" y="771" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">E</text>
  <text x="74" y="771" fill="#1f2937">Existing adapter on the generated catalogue: 20 of 63</text>
  <circle cx="44" cy="796" r="10" fill="#059669"/><text x="44" y="800" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">B</text>
  <text x="74" y="801" fill="#1f2937">Generated client back-end on the existing adapter: 55 of 68</text>
  <circle cx="530" cy="706" r="10" fill="#059669"/><text x="530" y="710" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">C</text>
  <text x="550" y="711" fill="#1f2937">Generated UI over B: 21 of 26 UI scenarios</text>
  <circle cx="530" cy="736" r="10" fill="#db2777"/><text x="530" y="741" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">D</text>
  <text x="550" y="741" fill="#1f2937">Existing UI on the generated back-ends: search and</text>
  <text x="550" y="759" fill="#1f2937">detail work, same calls as on its own stack</text>
  <line x1="515" y1="786" x2="545" y2="786" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="550" y="791" fill="#1f2937">Generated only: sign-in, other data spaces, stubs</text>
  <text x="500" y="840" text-anchor="middle" font-size="12" fill="#6b7280">Configuration only: no source file of either implementation changed. Federation left out: upstream has one data space.</text>
</svg>
