# Swap B: the build's client backend of data space A on upstream's adapter (8084) and catalogue backend (8081).
services:
  cbe-a:
    environment:
      QMA_URL: http://host.docker.internal:8084/v1
      CAT_URL: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
