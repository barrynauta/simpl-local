# Stand-in for the participant gateway the PSO suite expects: maps its mount paths onto the
# local upstream catalogue stack (May 2026). Tokens come from the build Keycloak; upstream
# does not check them. The May stack has no client back-end. Configuration only.
server {
    listen 8080;
    location /realms/            { proxy_pass http://host.docker.internal:18080/realms/; proxy_set_header Host localhost:18080; }
    location /fc/                { proxy_pass http://host.docker.internal:8081/; }
    location /xfsc-advsearch-be/ { return 404; }
    location /sdtooling-api/     { proxy_pass http://host.docker.internal:8084/v1/; }
}
