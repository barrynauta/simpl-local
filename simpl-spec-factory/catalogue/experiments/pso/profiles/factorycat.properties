# Profile "factorycat": the factory build of the Catalogue, data space A, behind the gateway stand-in (run-gateway.sh).
# Not a PSO environment. Users and passwords are the throwaway test values of the digest (section 5.3).
env=factorycat
bootstrap.release_factorycat=4.0.0
participant.url.governance-authority_factorycat=http://localhost:18500
participant.url.consumer_factorycat=http://localhost:18500
participant.url.data-provider_factorycat=http://localhost:18500
catalogue.xfsc.url_factorycat=http://localhost:18500
authority.token.endpoint=/realms/dataspace-a/protocol/openid-connect/token
token.endpoint=/realms/dataspace-a/protocol/openid-connect/token
KEYCLOAK_CLIENT_ID=test-client
export_test_to_jira=false
# role mapping: PSO role -> build user with the matching rights (D65 to D67)
credentials.authority.ga_schema_admin.username=schema-admin-a
credentials.authority.ga_schema_admin.password=Passw0rd!
credentials.authority.notary.username=provider-a
credentials.authority.notary.password=Passw0rd!
credentials.authority.t2iaa_m.username=consumer-a
credentials.authority.t2iaa_m.password=Passw0rd!
credentials.consumer.sd_consumer.username=consumer-a
credentials.consumer.sd_consumer.password=Passw0rd!
credentials.dataprovider.sd_publisher.username=provider-a
credentials.dataprovider.sd_publisher.password=Passw0rd!
