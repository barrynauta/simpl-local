# Stand-in for the participant gateway the PSO suite expects: maps its mount paths onto the
# factory build of data space A. Configuration only.
server {
    listen 8080;
    location /realms/            { proxy_pass http://host.docker.internal:18080/realms/; proxy_set_header Host localhost:18080; }
    location /fc/                { proxy_pass http://host.docker.internal:18101/; }
    location /xfsc-advsearch-be/ { proxy_pass http://host.docker.internal:18103/; }
    location /sdtooling-api/     { proxy_pass http://host.docker.internal:18102/v1/; }
}
