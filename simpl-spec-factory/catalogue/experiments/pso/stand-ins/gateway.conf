# gateway.conf plus the environment stand-ins of 4 Nov 2026: the five SD Tooling operations the suite
# needs to prepare a signed self-description go to sd-tooling.mjs. Everything else as in gateway.conf.
# Configuration only.
server {
    listen 8080;
    location /realms/            { proxy_pass http://host.docker.internal:18080/realms/; proxy_set_header Host localhost:18080; }
    location /fc/                { proxy_pass http://host.docker.internal:18101/; }
    location /xfsc-advsearch-be/ { proxy_pass http://host.docker.internal:18103/; }
    location /sdtooling-api/v1/policies/                 { proxy_pass http://pso-sd-tooling-cat:8080/v1/policies/; }
    location = /sdtooling-api/v2/schemas                 { proxy_pass http://pso-sd-tooling-cat:8080/v2/schemas; }
    location /sdtooling-api/v1/resourceAddresses/        { proxy_pass http://pso-sd-tooling-cat:8080/v1/resourceAddresses/; }
    location = /sdtooling-api/v1/selfDescriptions/finalized { proxy_pass http://pso-sd-tooling-cat:8080/v1/selfDescriptions/finalized; }
    location /sdtooling-api/     { proxy_pass http://host.docker.internal:18102/v1/; }
}
