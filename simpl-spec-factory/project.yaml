# Spec factory project: Simpl-Open (personal test project, see README.md).
# The engine holds the steps; this folder holds the Simpl-Open data. ./factory runs an engine
# script for this project.
name: Simpl-Open
engine:
  path: ~/src/spec-factory
  commit: 0cbc4c6          # the engine commit these results were made with; ./factory warns when it differs
story_key: SIMPL           # Jira key prefix: SIMPL-12345
jira_url: https://jira.simplprogramme.eu
gitlab_url: https://code.europa.eu
gitlab_group: simpl/simpl-open
gitlab_skip:
  - simpl/simpl-open/development/      # obsolete tree since Sep 2026
api_conventions:                       # API-42 and API-43 of the Simpl API guidelines
  license_contains: [European Union Public License, "1.2"]
  contact:
    name: Simpl Programme
    email: cnect-simpl@ec.europa.eu
components:
  - contract-management
  - schema-manager
  - catalogue
  - vocabulary-manager
