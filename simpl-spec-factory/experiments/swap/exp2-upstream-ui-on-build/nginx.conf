# Upstream UI nginx for experiment 2.
server {
  listen 8080;
  listen [::]:8080;

  location / {
    root  /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # API: the BUILD backend (published on the host at 8096, base path /v1).
  location /api/ {
    proxy_pass http://host.docker.internal:8096/v1/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 10m;
  }

  # Keycloak: strip the legacy /auth prefix the upstream UI adds. Same origin, so no CORS.
  location /auth/ {
    proxy_pass http://host.docker.internal:8183/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
