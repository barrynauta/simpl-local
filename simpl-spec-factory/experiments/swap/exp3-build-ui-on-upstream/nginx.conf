# Build UI nginx for experiment 3: same as the build's ui/nginx.conf, but /v1/ goes to the
# UPSTREAM backend (published on the host at 8086, base path /v1). Upstream only decodes the
# token, so the build UI's real Keycloak token (it carries an email claim) is accepted as is.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    location /v1/ {
        proxy_pass http://host.docker.internal:8086/v1/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
