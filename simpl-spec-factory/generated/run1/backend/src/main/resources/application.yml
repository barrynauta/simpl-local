server:
  port: 8080
  tomcat:
    # Let the application answer 413 itself instead of Tomcat resetting the connection.
    max-swallow-size: -1

spring:
  application:
    name: vocabulary-manager
  servlet:
    multipart:
      # Hard ceiling for the servlet container. The functional limit (D30) is app.max-upload-bytes.
      max-file-size: 100MB
      max-request-size: 101MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

app:
  # Base URL used to build absolute contentHref values.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8096/v1}
  # D18: namespace base for references between internal vocabularies.
  reference-base: ${APP_REFERENCE_BASE:https://vocabulary.simpl.local/vocabularies}
  # D30: upload limit, 10 MB by default.
  max-upload-bytes: ${APP_MAX_UPLOAD_BYTES:10485760}
  # D29: maximum page size.
  max-page-size: 100
  fuseki:
    url: ${APP_FUSEKI_URL:http://localhost:3030/vocabulary}
  security:
    jwk-set-uri: ${APP_JWK_SET_URI:http://localhost:8183/realms/simpl/protocol/openid-connect/certs}
    # Comma separated list of accepted token issuers.
    issuers: ${APP_ISSUERS:http://localhost:8183/realms/simpl}
    roles-claim: roles

logging:
  level:
    org.apache.jena: WARN
