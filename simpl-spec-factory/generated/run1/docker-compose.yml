name: vocabulary-manager

services:
  fuseki:
    image: secoresearch/fuseki:5.3.0
    # Plain Fuseki main server with one TDB2 dataset "vocabulary" (query, update, graph store). Not exposed to the host.
    entrypoint: []
    command:
      - sh
      - -c
      - >-
        mkdir -p /fuseki-base/databases/vocabulary &&
        exec java -cp '/jena-fuseki/fuseki-server.jar:/javalibs/*'
        org.apache.jena.fuseki.main.cmds.FusekiServerCmd
        --tdb2 --loc=/fuseki-base/databases/vocabulary --update /vocabulary
    volumes:
      - fuseki-data:/fuseki-base/databases
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:3030/vocabulary/query?query=ASK%7B%7D' >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One public hostname for every token: tokens fetched from the host (localhost:8183) and from inside the
      # network (keycloak:8080) both carry iss=http://localhost:8183/realms/simpl.
      KC_HOSTNAME: http://localhost:8183
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8183:8080"
    volumes:
      - ./keycloak/simpl-realm.json:/opt/keycloak/data/import/simpl-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  backend:
    build: ./backend
    environment:
      APP_FUSEKI_URL: http://fuseki:3030/vocabulary
      APP_JWK_SET_URI: http://keycloak:8080/realms/simpl/protocol/openid-connect/certs
      APP_ISSUERS: http://localhost:8183/realms/simpl
      APP_PUBLIC_BASE_URL: http://localhost:8096/v1
    ports:
      - "8096:8080"
    depends_on:
      fuseki:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  ui:
    build: ./ui
    ports:
      - "4333:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fuseki-data:
