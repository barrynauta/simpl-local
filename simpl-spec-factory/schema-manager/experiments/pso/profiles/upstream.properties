# Profile "upstream": the local upstream Schema Manager behind its UI proxy (adds /v1 and a token); tokens from the build Keycloak. Not a PSO environment.
# Users and passwords are the throwaway test values of the digest (D59).
env=upstream
bootstrap.release_upstream=4.0.0
participant.url.governance-authority_upstream=http://localhost:8185
participant.url.consumer_upstream=http://localhost:8185
participant.url.data-provider_upstream=http://localhost:8185
schema.manager.url_upstream=http://localhost:4322
authority.token.endpoint=/realms/simpl/protocol/openid-connect/token
token.endpoint=/realms/simpl/protocol/openid-connect/token
KEYCLOAK_CLIENT_ID=schema-tests
export_test_to_jira=false
credentials.authority.ga_schema_admin.username=ga-admin
credentials.authority.ga_schema_admin.password=password
credentials.authority.ga_schema_viewer.username=ga-viewer
credentials.authority.ga_schema_viewer.password=password
credentials.authority.t1uar_m.username=ga-admin
credentials.authority.t1uar_m.password=password
