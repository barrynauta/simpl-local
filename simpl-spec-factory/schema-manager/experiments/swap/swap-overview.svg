<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Schema Manager swap test: existing and generated, crossed</text>

  <!-- column headers -->
  <text x="330" y="72" text-anchor="middle" font-weight="bold" fill="#475569">Existing (upstream, Aug 2026)</text>
  <text x="730" y="72" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Generated (run 1)</text>

  <!-- UI walks -->
  <rect x="200" y="86" width="660" height="34" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="530" y="108" text-anchor="middle" fill="#713f12">UI walks: list, create, details, new version, download, publish, revoke</text>
  <line x1="330" y1="120" x2="330" y2="148" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>
  <line x1="730" y1="120" x2="730" y2="148" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>

  <!-- UIs -->
  <rect x="230" y="150" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="176" text-anchor="middle" font-weight="bold" fill="#1f2937">Existing UI</text>
  <text x="330" y="196" text-anchor="middle" font-size="12" fill="#4b5563">Vue, PrimeVue, nginx</text>
  <rect x="630" y="150" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="176" text-anchor="middle" font-weight="bold" fill="#1f2937">Generated UI</text>
  <text x="730" y="196" text-anchor="middle" font-size="12" fill="#4b5563">Vue 3, nginx</text>

  <!-- Keycloak -->
  <rect x="868" y="150" width="120" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="928" y="176" text-anchor="middle" font-weight="bold" fill="#1f2937">Keycloak</text>
  <text x="928" y="196" text-anchor="middle" font-size="12" fill="#4b5563">sign-in, roles</text>
  <line x1="832" y1="180" x2="866" y2="180" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- own pairing UI to back-end -->
  <line x1="330" y1="210" x2="330" y2="298" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="730" y1="210" x2="730" y2="298" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>

  <!-- swaps -->
  <line x1="390" y1="210" x2="668" y2="298" stroke="#d97706" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#orange)"/>
  <line x1="670" y1="210" x2="392" y2="298" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#purple)"/>
  <circle cx="440" cy="226" r="12" fill="#d97706"/><text x="440" y="231" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="620" cy="226" r="12" fill="#7c3aed"/><text x="620" y="231" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>

  <!-- back-ends -->
  <rect x="230" y="300" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="326" text-anchor="middle" font-weight="bold" fill="#1f2937">Existing back-end</text>
  <text x="330" y="346" text-anchor="middle" font-size="12" fill="#4b5563">Spring Boot, no role checks</text>
  <rect x="630" y="300" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="326" text-anchor="middle" font-weight="bold" fill="#1f2937">Generated back-end</text>
  <text x="730" y="346" text-anchor="middle" font-size="12" fill="#4b5563">Spring Boot, /v1</text>

  <!-- API walk -->
  <rect x="16" y="296" width="168" height="68" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="100" y="318" text-anchor="middle" fill="#713f12">API walk: 41 calls</text>
  <text x="100" y="338" text-anchor="middle" fill="#713f12">with the bridge file,</text>
  <text x="100" y="356" text-anchor="middle" fill="#713f12">accepted by both</text>
  <polyline points="100,364 100,396 290,396 290,362" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>
  <polyline points="290,396 690,396 690,362" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>
  <circle cx="490" cy="396" r="12" fill="#a16207"/><text x="490" y="401" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>

  <!-- back-end to stores -->
  <line x1="330" y1="360" x2="330" y2="448" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="730" y1="360" x2="730" y2="448" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>

  <!-- stores and side effects -->
  <rect x="230" y="450" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="476" text-anchor="middle" font-weight="bold" fill="#1f2937">Fuseki and Kafka</text>
  <text x="330" y="496" text-anchor="middle" font-size="12" fill="#4b5563">schemas, events</text>
  <rect x="630" y="450" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="730" y="476" text-anchor="middle" font-weight="bold" fill="#1f2937">PostgreSQL</text>
  <text x="730" y="496" text-anchor="middle" font-size="12" fill="#4b5563">Mailpit, webhooks, VM stub</text>
  <text x="530" y="476" text-anchor="middle" font-size="12" fill="#6b7280">data not swapped:</text>
  <text x="530" y="494" text-anchor="middle" font-size="12" fill="#6b7280">other stores</text>

  <!-- legend -->
  <line x1="16" y1="534" x2="984" y2="534" stroke="#e5e7eb"/>
  <line x1="24" y1="560" x2="64" y2="560" stroke="#6b7280" stroke-width="2.5"/>
  <text x="74" y="565" fill="#1f2937">Own pairing: each UI on its own back-end</text>
  <circle cx="44" cy="590" r="10" fill="#a16207"/><text x="44" y="595" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="74" y="595" fill="#1f2937">Same API walk on both back-ends: 33 of 41 calls, same status</text>
  <line x1="545" y1="620" x2="575" y2="620" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="74" y="625" fill="#1f2937">Bridge file: upstream sample plus the two default properties (D31)</text>
  <circle cx="560" cy="560" r="10" fill="#d97706"/><text x="560" y="565" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="580" y="565" fill="#1f2937">Existing UI on the generated back-end: all actions work</text>
  <circle cx="560" cy="590" r="10" fill="#7c3aed"/><text x="560" y="595" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="580" y="595" fill="#1f2937">Generated UI on the existing back-end: details page blank</text>
  <text x="580" y="625" fill="#1f2937">Sign-in through Keycloak (also used in 2)</text>
  <text x="500" y="650" text-anchor="middle" font-size="12" fill="#6b7280">Configuration only: no source file of either implementation changed</text>
</svg>
