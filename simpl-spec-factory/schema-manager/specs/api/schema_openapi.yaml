      summary: Revoke a Metadata Quality Profile.
      description: >-
        Soft-deletes the Metadata Quality Profile by transitioning its status to REVOKED.
        Revoked profiles remain readable for audit, compliance, and operational recovery,
        but are excluded from the active quality assessment pipeline for newly published
        resources. Bulk update jobs scheduled before the revocation timestamp are allowed
        to complete; jobs started after revocation skip the profile. Only callers with the
        GA_SCHEMA_ADMIN realm role may invoke this operation. Deletion is rejected when
        the profile is the sole PUBLISHED profile for its resourceType; publish a
        replacement profile first.
