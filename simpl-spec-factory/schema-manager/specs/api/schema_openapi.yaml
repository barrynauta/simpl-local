    ActiveMetadataQualityProfileResponsePayload:
      type: object
      description: >-
        A valid JSON-LD serialization of the stored Metadata Quality Profile RDF graph. JSON-LD compaction,
        property names, value objects, arrays, and RDF list representation are serializer-dependent; consumers
        must interpret the RDF semantics rather than rely on a specific JSON layout.
      required:
        - '@graph'
      properties:
        '@context':
          description: Optional JSON-LD context generated by the RDF serializer.
          oneOf:
            - type: string
            - type: array
            - type: object
              additionalProperties: true
        '@graph':
          type: array
          minItems: 1
          description: JSON-LD graph containing a simpl:QualityProfile resource and its related RDF resources.
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
