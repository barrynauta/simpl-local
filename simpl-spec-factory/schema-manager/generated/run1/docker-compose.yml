name: schema-factory

# Schema Manager reference environment. Start with:  docker compose up -d --build --wait
#
# Host ports:
#   API              http://localhost:8098/v1   (SM_BASE_URL)
#   UI               http://localhost:4334      (SM_UI_URL)
#   Keycloak         http://localhost:8185      (KEYCLOAK_URL)
#   Vocabulary stub  http://localhost:8099      (VOCABULARY_MANAGER_URL for tests)
#   Mailpit HTTP API http://localhost:8027      (MAIL_API_URL)
#
# Token issuer: Keycloak runs with KC_HOSTNAME=http://localhost:8185, so every token carries
# iss=http://localhost:8185/realms/simpl, whether it was fetched from the host or from inside
# the network. The backend checks that issuer and fetches the JWKS over the internal name
# (KEYCLOAK_JWKS_URL), which works because KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets back-channel
# requests use the host name they arrive on.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schema
      POSTGRES_USER: schema
      POSTGRES_PASSWORD: schema
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schema -d schema"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Not exposed on the host (5432 is taken).

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8185
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-simpl.json:/opt/keycloak/data/import/realm-simpl.json:ro
    ports:
      - "8185:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8027:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  vocabulary-stub:
    build: ./vocabulary-stub
    ports:
      - "8099:8099"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      vocabulary-stub:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/schema
      DB_USER: schema
      DB_PASSWORD: schema
      SM_BASE_URL: http://localhost:8098/v1
      SM_PUBLIC_BASE_URL: http://localhost:8098/v1
      SM_UI_URL: http://localhost:4334
      KEYCLOAK_URL: http://localhost:8185
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/simpl/protocol/openid-connect/certs
      VOCABULARY_MANAGER_URL: http://vocabulary-stub:8099
      VOCABULARY_NAMESPACE_BASE: https://vocabulary.simpl.test/content/
      SM_DEFAULT_PROPERTIES: https://simpl-programme.ec.europa.eu/ns/default#uuid,https://simpl-programme.ec.europa.eu/ns/default#version
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      NOTIFICATION_FROM: schema-manager@simpl.test
      PROVIDER_NOTIFICATION_EMAILS: providers@simpl.test
      PROVIDER_INSTRUCTIONS_URL: http://localhost:4334/schemas
      CORS_ALLOWED_ORIGINS: http://localhost:4334
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8098:8080"

  ui:
    build: ./ui
    depends_on:
      backend:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://localhost:8185
      KEYCLOAK_REALM: simpl
    ports:
      - "4334:8080"

volumes:
  pgdata:
