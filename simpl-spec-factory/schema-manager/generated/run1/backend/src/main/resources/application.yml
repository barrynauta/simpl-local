server:
  port: 8080
  servlet:
    context-path: /v1
  shutdown: graceful

spring:
  application:
    name: schema-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/schema}
    username: ${DB_USER:schema}
    password: ${DB_PASSWORD:schema}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  web:
    resources:
      add-mappings: false
  mvc:
    problemdetails:
      enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

# All settings below use the configuration names of D60.
sm:
  public-base-url: ${SM_PUBLIC_BASE_URL:${SM_BASE_URL:http://localhost:8080/v1}}
  keycloak-url: ${KEYCLOAK_URL:http://localhost:8185}
  keycloak-realm: ${KEYCLOAK_REALM:simpl}
  # JWKS location. Defaults to {KEYCLOAK_URL}/realms/{realm}/protocol/openid-connect/certs.
  # Inside the compose network it points to the internal Keycloak host name.
  keycloak-jwks-url: ${KEYCLOAK_JWKS_URL:}
  vocabulary-manager-url: ${VOCABULARY_MANAGER_URL:http://localhost:8099}
  vocabulary-namespace-base: ${VOCABULARY_NAMESPACE_BASE:https://vocabulary.simpl.test/content/}
  default-properties: ${SM_DEFAULT_PROPERTIES:https://simpl-programme.ec.europa.eu/ns/default#uuid,https://simpl-programme.ec.europa.eu/ns/default#version}
  notification-from: ${NOTIFICATION_FROM:schema-manager@simpl.test}
  provider-notification-emails: ${PROVIDER_NOTIFICATION_EMAILS:providers@simpl.test}
  provider-instructions-url: ${PROVIDER_INSTRUCTIONS_URL:https://simpl-programme.ec.europa.eu/schemas/instructions}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${SM_UI_URL:http://localhost:4334}}
