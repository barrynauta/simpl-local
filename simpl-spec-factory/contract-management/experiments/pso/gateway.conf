# Stand-in for the participant gateway the PSO suite expects, in front of the factory build of the
# Provider. Assumption, as in a real Tier 1 gateway: the gateway authenticates the user, the
# contract manager behind it takes its API key (D77). This stand-in does not check the token: it
# adds the key when an Authorization header is present and forwards without the key otherwise.
# Configuration only.
map $http_authorization $cm_key { "" ""; default "test-cm-provider-key"; }
server {
    listen 8080;
    location /realms/      { proxy_pass http://host.docker.internal:19080/realms/; proxy_set_header Host localhost:19080; }
    location /contract/v1/ { proxy_pass http://host.docker.internal:19101/contract/v1/; proxy_set_header X-Api-Key $cm_key; proxy_set_header Authorization ""; }
    # Environment stand-in (4 Nov 2026) for the IAA participant agent echo: the Provider is taken as
    # already onboarded and CONNECTED, so the suite reuses it instead of onboarding a new participant
    # through IAA. Fixed answer, no IAA behind it. Needs a token, does not check it.
    location = /authApi/tier1/v2/echo {
        default_type application/json;
        if ($http_authorization = "") { return 401 '{"status":401,"title":"Unauthorized"}'; }
        return 200 '{"id":"factory-provider","connectionStatus":"CONNECTED","identityAttributes":[]}';
    }
}
