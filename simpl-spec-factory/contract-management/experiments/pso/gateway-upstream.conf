# Stand-in for the participant gateway the PSO suite expects, in front of the local upstream contract stack (63c6749), in the role of the
# Provider. Assumption, as in a real Tier 1 gateway: the gateway authenticates the user, the
# contract manager behind it takes its API key (`apikey` in the local stack). This stand-in does not check the token: it
# adds the key when an Authorization header is present and forwards without the key otherwise.
# Configuration only.
map $http_authorization $cm_key { "" ""; default "apikey"; }
server {
    listen 8080;
    location /realms/      { proxy_pass http://host.docker.internal:19080/realms/; proxy_set_header Host localhost:19080; }
    location /contract/v1/ { proxy_pass http://host.docker.internal:8086/contract/v1/; proxy_set_header X-Api-Key $cm_key; proxy_set_header Authorization ""; }
}
