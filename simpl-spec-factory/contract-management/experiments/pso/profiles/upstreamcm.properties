# Profile "upstreamcm": the local upstream contract stack (63c6749) behind the gateway stand-in (run-gateway-upstream.sh); tokens from the build Keycloak, upstream checks only the API key.
env=upstreamcm
bootstrap.release_upstreamcm=4.0.0
participant.url.governance-authority_upstreamcm=http://localhost:19501
participant.url.consumer_upstreamcm=http://localhost:19501
participant.url.data-provider_upstreamcm=http://localhost:19501
authority.token.endpoint=/realms/provider/protocol/openid-connect/token
token.endpoint=/realms/provider/protocol/openid-connect/token
KEYCLOAK_CLIENT_ID=contract-ui
export_test_to_jira=false
# role mapping: PSO role -> build user (D67); the build's realm roles are contract_manager and consent_manager
credentials.dataprovider.sd_publisher.username=provider-operator
credentials.dataprovider.sd_publisher.password=ProviderOperator1!
credentials.dataprovider.t1uar_m.username=provider-admin
credentials.dataprovider.t1uar_m.password=ProviderAdmin1!
