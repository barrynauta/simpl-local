# The upstream contract backend at 63c6749 (Aug 2026) needs settings that the local stack
# (built for the June version) does not set. Inert values, configuration only.
services:
  contract:
    environment:
      CATALOG_TOKEN_URL: http://catalogue-stub:8080/token
      CATALOG_CLIENT_ID: inert
      CATALOG_CLIENT_SECRET: inert
      CATALOG_TOKEN_USER: inert
      CATALOG_TOKEN_PASSWORD: inert
      CATALOG_AUTH_USER: inert
      CATALOG_AUTH_PASSWORD: inert
