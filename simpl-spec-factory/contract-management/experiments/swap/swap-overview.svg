<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Contract Management swap test: existing and generated, crossed</text>

  <text x="300" y="72" text-anchor="middle" font-weight="bold" fill="#475569">Existing (local upstream stack, Aug 2026)</text>
  <text x="720" y="72" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Generated (run 1, Provider party)</text>

  <!-- UIs -->
  <rect x="200" y="90" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="116" text-anchor="middle" font-weight="bold" fill="#1f2937">Existing UI</text>
  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#4b5563">shell plus local read page</text>
  <rect x="620" y="90" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="116" text-anchor="middle" font-weight="bold" fill="#1f2937">Generated UI and UI backend</text>
  <text x="720" y="136" text-anchor="middle" font-size="12" fill="#4b5563">Vue 3, Keycloak, per party</text>

  <!-- own pairings -->
  <line x1="300" y1="150" x2="300" y2="238" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="720" y1="150" x2="720" y2="238" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>

  <!-- swap 2 -->
  <line x1="360" y1="150" x2="660" y2="238" stroke="#d97706" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#orange)"/>
  <circle cx="420" cy="168" r="12" fill="#d97706"/><text x="420" y="173" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
  <!-- not possible -->
  <line x1="660" y1="150" x2="360" y2="238" stroke="#9ca3af" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="600" y="176" text-anchor="middle" font-size="12" fill="#6b7280">not possible</text>

  <!-- back-ends -->
  <rect x="200" y="240" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="266" text-anchor="middle" font-weight="bold" fill="#1f2937">Existing contract manager</text>
  <text x="300" y="286" text-anchor="middle" font-size="12" fill="#4b5563">Spring Boot, one party</text>
  <rect x="620" y="240" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="266" text-anchor="middle" font-weight="bold" fill="#1f2937">Generated contract manager</text>
  <text x="720" y="286" text-anchor="middle" font-size="12" fill="#4b5563">Spring Boot, two parties</text>

  <!-- API walk -->
  <rect x="16" y="236" width="160" height="68" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="96" y="258" text-anchor="middle" fill="#713f12">API walk: 20 calls</text>
  <text x="96" y="278" text-anchor="middle" fill="#713f12">OpenAPI operations</text>
  <text x="96" y="296" text-anchor="middle" fill="#713f12">only</text>
  <polyline points="96,304 96,336 260,336 260,302" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>
  <polyline points="260,336 680,336 680,302" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#brown)"/>
  <circle cx="470" cy="336" r="12" fill="#a16207"/><text x="470" y="341" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>

  <!-- Kafka -->
  <line x1="300" y1="300" x2="300" y2="388" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <line x1="720" y1="300" x2="720" y2="388" stroke="#6b7280" stroke-width="2.5" marker-end="url(#grey)"/>
  <rect x="170" y="390" width="260" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="414" text-anchor="middle" font-weight="bold" fill="#1f2937">Kafka: establishment</text>
  <text x="300" y="434" text-anchor="middle" font-size="12" fill="#4b5563">create, sign, search, verification</text>
  <text x="300" y="450" text-anchor="middle" font-size="12" fill="#4b5563">request and response topics</text>
  <rect x="590" y="390" width="260" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="414" text-anchor="middle" font-weight="bold" fill="#1f2937">HTTP with connector, plus Kafka</text>
  <text x="720" y="434" text-anchor="middle" font-size="12" fill="#4b5563">lifecycle, status, notifications</text>
  <text x="720" y="450" text-anchor="middle" font-size="12" fill="#4b5563">(digest D46 to D51)</text>
  <line x1="432" y1="425" x2="588" y2="425" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="510" cy="425" r="12" fill="#b91c1c"/><text x="510" y="430" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
  <text x="510" y="452" text-anchor="middle" font-size="12" fill="#b91c1c">no topic in common</text>

  <!-- legend -->
  <line x1="16" y1="490" x2="984" y2="490" stroke="#e5e7eb"/>
  <line x1="24" y1="516" x2="64" y2="516" stroke="#6b7280" stroke-width="2.5"/>
  <text x="74" y="521" fill="#1f2937">Own pairing</text>
  <circle cx="44" cy="546" r="10" fill="#a16207"/><text x="44" y="551" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="74" y="551" fill="#1f2937">Same API walk on both: 13 of 20 calls same status, same 10 agreement fields</text>
  <circle cx="44" cy="576" r="10" fill="#d97706"/><text x="44" y="581" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="74" y="581" fill="#1f2937">Existing read page on the generated back-end: works, all fields shown</text>
  <circle cx="44" cy="606" r="10" fill="#b91c1c"/><text x="44" y="611" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="74" y="611" fill="#1f2937">Events between parties: different models, no published event contract</text>
  <text x="500" y="632" text-anchor="middle" font-size="12" fill="#6b7280">Configuration only: no source file of either implementation changed</text>
</svg>
