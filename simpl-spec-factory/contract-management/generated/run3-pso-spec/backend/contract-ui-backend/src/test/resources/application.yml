spring:
  datasource:
    url: jdbc:h2:mem:uibe;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
uibe:
  participant-id: consumer-01
  party-role: CONSUMER
  api-key: uibe-key
