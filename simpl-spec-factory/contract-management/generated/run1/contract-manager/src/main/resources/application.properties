server.port=8080
server.servlet.context-path=/contract/v1
server.error.include-stacktrace=never
server.error.include-message=never
spring.application.name=contract-manager
spring.main.banner-mode=off
spring.jackson.default-property-inclusion=always
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=false
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/cm_provider}
spring.datasource.username=${DB_USER:simpl}
spring.datasource.password=${DB_PASSWORD:simpl}
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB
server.tomcat.max-swallow-size=-1
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.admin.fail-fast=false
logging.pattern.level=%5p [%X{correlationId:-}]
