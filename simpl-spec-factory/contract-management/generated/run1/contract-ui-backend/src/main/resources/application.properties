server.port=8080
server.servlet.context-path=/contract-ui/v1
server.error.include-stacktrace=never
server.error.include-message=never
spring.application.name=contract-ui-backend
spring.main.banner-mode=off
spring.jackson.default-property-inclusion=always
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=false
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/uibe_provider}
spring.datasource.username=${DB_USER:simpl}
spring.datasource.password=${DB_PASSWORD:simpl}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.pattern.level=%5p [%X{correlationId:-}]
