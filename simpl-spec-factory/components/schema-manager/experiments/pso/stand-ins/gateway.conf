# Environment stand-in (4 Nov 2026) for the governance authority gateway of the PSO suite: tokens go
# to the build's Keycloak, the Users and Roles API of IAA goes to iaa-users.mjs. Configuration only.
server {
    listen 8080;
    location /realms/                  { proxy_pass http://host.docker.internal:8185/realms/; proxy_set_header Host localhost:8185; }
    location /userApi/tier1/v2/users   { proxy_pass http://pso-iaa-users-sm:8080; }
}
