# Build profile of the Vocabulary Manager for steps 40 to 70 (run 9, 19 Nov 2026; runs 4 to 8 used the same profile with compose projects vm-factory-run4 to vm-factory-run8).
# The stack is the one of run 1, so the results can be compared; the ports are new, so run 1 can keep its own.
component: vocabulary-manager
compose_project: vm-factory-run9
start: docker compose -p vm-factory-run9 up -d --build --wait
stack:
  backend: Java 21, Spring Boot 4 (4.1.2 or a newer 4.x patch; upstream uses 4.1.0), Maven (one project, modules allowed)
  store: Apache Jena Fuseki, dataset 'vocabulary' (decision E3)
  identity_provider: Keycloak with the realm, clients and users of decision E1, imported at startup; password grant enabled for a public test client 'vocabulary-tests'
  ui: Vue 3 + Vite + TypeScript, plain component library, served by nginx that also proxies the API
ports:            # host ports; only these may be exposed
  api: 8196       # API base http://localhost:8196/v1 (decision E2 gives the path, the host port is this one)
  ui: 4433
  keycloak: 8193  # token endpoint http://localhost:8193/realms/simpl/protocol/openid-connect/token
  api_store_down: 8199   # second backend with an unreachable store (stack.sh store-down-up, decision D44)
tests:
  harness: Python 3, behave, requests; Playwright for Python for the UI steps of step 60
  environment:
    API_URL: http://localhost:8196/v1
    TOKEN_URL: http://localhost:8193/realms/simpl/protocol/openid-connect/token
    TOKEN_CLIENT: vocabulary-tests
    TOKEN_CLIENT_NOAUD: vocabulary-tests-noaud    # E7: same realm, no audience mapper, expect 401
    TOKEN_URL_OTHER: http://localhost:8193/realms/simpl-other/protocol/openid-connect/token   # E7: wrong issuer, expect 401
    UI_URL: http://localhost:4433
    STORE_DOWN_API_URL: http://localhost:8199/v1
  users: from decision E1 (ga-admin, ga-viewer, ga-norole, password 'Password1!')
  reset: tests may not reset the store; every scenario creates its own data with a unique run id
finish_line:
  - the start command succeeds from a clean state
  - smoke.sh: token for ga-admin, create a vocabulary, create a new version, list, download, search; ga-viewer gets 403 on create; no token gets 401
  - mvn verify green, with a JaCoCo report
  - Trivy scan of the dependencies and every image of the stack; HIGH and CRITICAL fixed or listed with a reason in SECURITY-SCAN.md (Trivy is at /opt/homebrew/bin/trivy)
  - leave the stack running
compare_with:
  run: run8 (19 Nov 2026), components/vocabulary-manager/runs/run8, 463 of 465 cases, 1 UI failure on the report role (D90 now), Q1 throughput missed (D99 now); run7 (19 Nov 2026), components/vocabulary-manager/runs/run7, 420 of 424 cases, Q1 met at Q4 design load, design review gaps now decided (D82 to D87); run6 (19 Nov 2026), components/vocabulary-manager/runs/run6, 428 of 432 cases, first orchestrated run, failures at the 5 MB store write (D71 now); run5 (18 Nov 2026), components/vocabulary-manager/runs/run5, 463 of 468 cases, Spring Boot 4.1.2, 0 CRITICAL in own targets; run4 (17 Nov 2026), components/vocabulary-manager/runs/run4, 379 of 386 scenarios, Trivy 17 CRITICAL; run1 (27 Oct 2026), components/vocabulary-manager/generated/run1, 74 of 74 API and 22 of 22 UI scenarios of its own suite
fuzz:             # step 70: property-based API fuzzing with Schemathesis (pipeline/fuzz_api.py)
  openapi: specs/api/vocabulary_openapi-tier1.yaml
  user: ga-admin   # decision E1
  password: Password1!
  max_examples: 30
  seed: 1
  max_time: 300
