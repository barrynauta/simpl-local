# Vocabulary Manager local stack (spec-factory run 6). Start: docker compose -p vm-factory-run6 up -d --build --wait
# Only the ports of the build profile are published: api 8196, ui 4433, keycloak 8193 (and 8199 for the
# store-down backend of profile "store-down"). Fuseki is not published.
name: vm-factory-run6

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

x-backend-env: &backend-env
  SERVER_PORT: "8080"
  MANAGEMENT_PORT: "8081"
  VOCABULARY_CONTENT_BASE_URL: ${VOCABULARY_CONTENT_BASE_URL:-https://authority.example/vocabulary-manager}
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8193/realms/simpl}
  OIDC_AUDIENCE: vocabulary-manager-be
  OIDC_JWK_SET_URI: http://keycloak:8080/realms/simpl/protocol/openid-connect/certs
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp"

services:
  fuseki:
    build:
      context: ./fuseki
    image: vm-factory-run6/fuseki:6.2.0
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - fuseki-data:/fuseki/databases
    networks: [backend]
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    <<: *hardening
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8193
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_CONSOLE_OUTPUT: json
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      - ./keycloak/realm-simpl.json:/opt/keycloak/data/import/realm-simpl.json:ro
    ports:
      - "8193:8080"
    networks: [backend]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 40

  backend:
    build:
      context: ./backend
    image: vm-factory-run6/vocabulary-manager-be:1.0.0
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=128m
    environment:
      <<: *backend-env
      STORE_DATASET_URL: http://fuseki:3030/vocabulary
    ports:
      - "8196:8080"
    networks: [backend]
    depends_on:
      fuseki:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s

  ui:
    build:
      context: ./ui
    image: vm-factory-run6/vocabulary-manager-ui:1.0.0
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /etc/nginx/conf.d:size=1m,mode=1777
    ports:
      - "4433:8080"
    networks: [backend]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  # Second backend whose store is unreachable (decision D44), started by ./stack.sh store-down-up.
  backend-store-down:
    profiles: ["store-down"]
    image: vm-factory-run6/vocabulary-manager-be:1.0.0
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=128m
    environment:
      <<: *backend-env
      STORE_DATASET_URL: http://127.0.0.1:1/vocabulary
    ports:
      - "8199:8080"
    networks: [backend]
    depends_on:
      keycloak:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

volumes:
  fuseki-data:

networks:
  backend:
