# Answers of the proxy itself are problem+json (D122, D158, D178). Named locations cannot be requested from
# outside (D155).
error_page 400 @e400;
error_page 405 @e405;
error_page 413 @e413;
error_page 414 /.well-known/vm-proxy-problems/uri-too-long;
error_page 494 =431 @e431;
error_page 502 504 =503 @e503;

location @e400 {
    default_type application/problem+json;
    return 400 '{"type":"urn:problem-type:belgif:badRequest","href":"https://www.belgif.be/specification/rest/api-guide/problems/badRequest.html","title":"Bad Request","status":400,"detail":"The input message is incorrect"}';
}
location @e405 {
    default_type application/problem+json;
    add_header Allow $allow_methods always;
    return 405 '{"type":"urn:problem-type:simpl:methodNotAllowed","title":"Method Not Allowed","status":405,"detail":"The method is not allowed on this resource."}';
}
location @e413 {
    default_type application/problem+json;
    return 413 '{"type":"urn:problem-type:simpl:payloadTooLarge","title":"Payload Too Large","status":413,"detail":"The request is larger than the maximum allowed size of 6 MB."}';
}
# A request line that is too long has no URI yet, so nginx cannot use a named location here. The location below
# is used for the 414 page only; a client that requests it directly is passed to the backend like any unknown
# path (D155).
location = /.well-known/vm-proxy-problems/uri-too-long {
    default_type application/problem+json;
    if ($request_uri !~ "^/\.well-known/vm-proxy-problems/") {
        return 414 '{"type":"urn:problem-type:simpl:uriTooLong","title":"URI Too Long","status":414,"detail":"The request URI is too long."}';
    }
    proxy_pass http://backend;
}
location @e431 {
    default_type application/problem+json;
    return 431 '{"type":"urn:problem-type:simpl:requestHeaderFieldsTooLarge","title":"Request Header Fields Too Large","status":431,"detail":"The request headers are too large."}';
}
location @e503 {
    default_type application/problem+json;
    add_header Retry-After 5 always;
    return 503 '{"type":"urn:problem-type:belgif:serviceUnavailable","href":"https://www.belgif.be/specification/rest/api-guide/problems/serviceUnavailable.html","title":"Service Unavailable","status":503,"detail":"The vocabulary service is not available. Retry later."}';
}
