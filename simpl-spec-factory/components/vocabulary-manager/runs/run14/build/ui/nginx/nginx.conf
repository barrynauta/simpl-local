# Front proxy of the Vocabulary Manager: the API port and the UI port (same origin for the UI, D126).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Access log without query string, Authorization header or body (D80, D173).
    log_format main '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    merge_slashes off;
    client_max_body_size 7m;
    client_body_buffer_size 1m;
    large_client_header_buffers 4 8k;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend {
        zone backend 64k;
        server backend:8080 resolve;
        keepalive 32;
    }

    # Methods per declared path, for the Allow header of the proxy's own 405 (TRACE, D178).
    map $uri $allow_methods {
        default "";
        ~^/v1/health$ "GET";
        ~^/v1/vocabularies$ "GET, POST";
        ~^/v1/vocabularies/searches$ "POST";
        ~^/v1/vocabularies/[^/]+$ "GET, PATCH";
        ~^/v1/vocabularies/[^/]+/versions$ "GET, POST";
        ~^/v1/vocabularies/[^/]+/versions/[^/]+$ "GET, PATCH";
        ~^/v1/content/[^/]+$ "GET";
        ~^/v1/content/[^/]+/versions/[^/]+$ "GET";
        ~^/v1/external-vocabularies$ "GET, POST";
        ~^/v1/external-vocabulary/searches$ "POST";
        ~^/v1/external-vocabularies/content$ "POST";
        ~^/v1/external-vocabularies/[^/]+/content$ "GET";
        ~^/v1/external-vocabularies/[^/]+$ "GET, DELETE";
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    # API port: every path goes to the backend, which answers unknown paths itself (D67, D155).
    server {
        listen 8080 default_server;
        include /etc/nginx/problems.conf;
        location / {
            proxy_pass http://backend;
        }
    }

    # UI port: the single page application, and the API under /v1 on the same origin.
    server {
        listen 8081;
        include /etc/nginx/problems.conf;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${KEYCLOAK_PUBLIC_URL}; frame-src ${KEYCLOAK_PUBLIC_URL}; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${KEYCLOAK_PUBLIC_URL}" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /v1/ {
            proxy_pass http://backend;
        }
        location = /config.json {
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'none'" always;
            default_type application/json;
            alias /tmp/config.json;
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location / {
            try_files $uri /index.html;
        }
    }
}
