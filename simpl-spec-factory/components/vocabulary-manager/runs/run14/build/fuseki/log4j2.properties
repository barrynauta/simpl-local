# Fuseki logging (D173): keep the request log (method, URL, status), never the query or update text.
status = error
name = FusekiLogging
appender.console.type = Console
appender.console.name = OUT
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSSX} %-5p %-10c{1} %m%n
rootLogger.level = WARN
rootLogger.appenderRef.stdout.ref = OUT
logger.server.name = org.apache.jena.fuseki.Server
logger.server.level = INFO
logger.request.name = org.apache.jena.fuseki.Request
logger.request.level = INFO
logger.fuseki.name = org.apache.jena.fuseki.Fuseki
logger.fuseki.level = WARN
logger.compact.name = org.apache.jena.fuseki.Compact
logger.compact.level = INFO
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN
