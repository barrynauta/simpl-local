spring:
  application:
    name: vocabulary-manager-be
  main:
    banner-mode: "off"
  autoconfigure:
    exclude:
      - org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration
  servlet:
    multipart:
      enabled: true
      resolve-lazily: true
      max-file-size: -1
      max-request-size: 6291456
      file-size-threshold: 1MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 64KB
  tomcat:
    max-part-count: 1000
    max-part-header-size: 8KB
    max-swallow-size: -1
    max-http-form-post-size: 7MB
    max-parameter-count: 10000
    connection-timeout: 20s

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  metrics:
    tags:
      application: vocabulary-manager-be

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    org.apache.jena: WARN

vocabulary:
  content-base-url: ${VOCABULARY_CONTENT_BASE_URL:https://authority.example/vocabulary-manager}
  upload-slots: ${UPLOAD_SLOTS:4}
  store:
    url: ${STORE_URL:http://localhost:3030}
    dataset: ${STORE_DATASET:vocabulary}
    read-user: ${STORE_READ_USER:vm_read}
    read-password: ${STORE_READ_PASSWORD:}
    update-user: ${STORE_UPDATE_USER:vm_update}
    update-password: ${STORE_UPDATE_PASSWORD:}
    connect-timeout-ms: 2000
    read-timeout-ms: 10000
    update-timeout-ms: 45000
  identity:
    issuer: ${ISSUER_URI:http://localhost:8193/realms/simpl}
    audience: ${TOKEN_AUDIENCE:vocabulary-manager-be}
    jwks-url: ${JWKS_URL:http://localhost:8193/realms/simpl/protocol/openid-connect/certs}
    key-fetch-timeout-ms: 2000
