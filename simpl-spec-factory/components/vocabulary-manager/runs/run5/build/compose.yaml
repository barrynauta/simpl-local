# Vocabulary Manager stack (build profile run 5). Start: docker compose -p vm-factory-run5 up -d --build --wait
# Ports and URLs come from the environment (decision E4); defaults are the ones of input/build.yaml.
name: vm-factory-run5

services:
  fuseki:
    build: ./fuseki
    image: vm-factory-run5/fuseki:6.2.0
    volumes:
      - fuseki-data:/fuseki/databases
    restart: unless-stopped
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8193}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      UI_URL: http://localhost:${UI_PORT:-4433}
    volumes:
      - ./keycloak/simpl-realm.json:/opt/keycloak/data/import/simpl-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8193}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 40
    restart: unless-stopped
    networks: [internal]

  backend:
    build: ./backend
    image: vm-factory-run5/backend:1.0.0
    environment:
      STORE_URL: http://fuseki:3030/vocabulary
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8193}/realms/simpl
      OIDC_JWKS_URL: http://keycloak:8080/realms/simpl/protocol/openid-connect/certs
      OIDC_AUDIENCE: vocabulary-manager-be
      VOCABULARY_CONTENT_BASE_URL: ${VOCABULARY_CONTENT_BASE_URL:-https://authority.example/vocabulary-manager}
    ports:
      - "${API_PORT:-8196}:8080"
    depends_on:
      fuseki:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  ui:
    build: ./ui
    image: vm-factory-run5/ui:1.0.0
    environment:
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8193}
      KEYCLOAK_REALM: simpl
      KEYCLOAK_CLIENT_ID: vocabulary-manager-ui
      API_UPSTREAM: http://backend:8080
    ports:
      - "${UI_PORT:-4433}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

volumes:
  fuseki-data:

networks:
  internal:
