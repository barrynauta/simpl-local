# Vocabulary Manager stack (run 7). Start: docker compose -p vm-factory-run7 up -d --build --wait
# Only the host ports of the build profile are published: api 8196, ui 4433, keycloak 8193,
# fuseki 3141 (loopback, debugging only), api_store_down 8199 (profile storedown).
name: vm-factory-run7

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  fuseki:
    <<: *hardening
    build:
      context: ./fuseki
    image: vm-factory-run7/fuseki:6.2.0
    volumes:
      - fuseki-data:/fuseki/databases
    ports:
      - "127.0.0.1:3141:3030"
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 20s

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --http-port=8080
      - --hostname=${KEYCLOAK_PUBLIC_URL:-http://localhost:8193}
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
      - --db=dev-file
      - --cache=local
    environment:
      KC_LOG_LEVEL: info
    volumes:
      - ./keycloak/realm-simpl.json:/opt/keycloak/data/import/realm-simpl.json:ro
    ports:
      - "8193:8080"
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 40

  backend:
    <<: *hardening
    build:
      context: ./backend
    image: vm-factory-run7/backend:1.0.0
    environment:
      STORE_URL: http://fuseki:3030/vocabulary
      ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8193}/realms/simpl
      JWKS_URI: http://keycloak:8080/realms/simpl/protocol/openid-connect/certs
      TOKEN_AUDIENCE: vocabulary-manager-be
      VOCABULARY_CONTENT_BASE_URL: ${VOCABULARY_CONTENT_BASE_URL:-https://authority.example/vocabulary-manager}
    ports:
      - "8196:8080"
    depends_on:
      fuseki:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 35s

  backend-store-down:
    <<: *hardening
    profiles: ["storedown"]
    image: vm-factory-run7/backend:1.0.0
    environment:
      STORE_URL: http://127.0.0.1:1/vocabulary
      ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8193}/realms/simpl
      JWKS_URI: http://keycloak:8080/realms/simpl/protocol/openid-connect/certs
      TOKEN_AUDIENCE: vocabulary-manager-be
      VOCABULARY_CONTENT_BASE_URL: ${VOCABULARY_CONTENT_BASE_URL:-https://authority.example/vocabulary-manager}
    ports:
      - "8199:8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 35s

  ui:
    <<: *hardening
    build:
      context: ./ui
    image: vm-factory-run7/ui:1.0.0
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8193}
      KEYCLOAK_REALM: simpl
      KEYCLOAK_CLIENT_ID: vocabulary-manager-ui
      API_UPSTREAM: http://backend:8080
    ports:
      - "4433:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0755
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

volumes:
  fuseki-data:
