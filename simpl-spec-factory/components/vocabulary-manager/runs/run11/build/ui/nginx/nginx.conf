# UI server (8080) and API proxy (8081) of the Vocabulary Manager (MACH-04, D102, D122, D123).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # D122: the proxy limit sits above the service limits (6 MB), so the service decides on sizes.
  client_max_body_size 7m;
  client_body_buffer_size 1m;
  proxy_request_buffering on;
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  proxy_intercept_errors off;

  # Docker DNS, re-resolved every 10 s so every backend replica is used (D102).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Allow header for the 405 the proxy answers itself (TRACE), per declared path (D122, D126).
  map $request_uri $allow_methods {
    default "";
    ~^/v1/health(\?.*)?$ "GET";
    ~^/v1/vocabularies(\?.*)?$ "GET, POST";
    ~^/v1/vocabularies/searches(\?.*)?$ "POST";
    ~^/v1/vocabularies/[^/]+(\?.*)?$ "GET, PATCH";
    ~^/v1/vocabularies/[^/]+/versions(\?.*)?$ "GET, POST";
    ~^/v1/vocabularies/[^/]+/versions/[^/]+(\?.*)?$ "GET, PATCH";
    ~^/v1/content/[^/]+(\?.*)?$ "GET";
    ~^/v1/content/[^/]+/versions/[^/]+(\?.*)?$ "GET";
    ~^/v1/external-vocabularies(\?.*)?$ "GET, POST";
    ~^/v1/external-vocabulary/searches(\?.*)?$ "POST";
    ~^/v1/external-vocabularies/content(\?.*)?$ "POST";
    ~^/v1/external-vocabularies/[^/]+/content(\?.*)?$ "GET";
    ~^/v1/external-vocabularies/[^/]+(\?.*)?$ "GET, DELETE";
  }

  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
  }

  server {
    listen 8081;
    server_name _;

    error_page 400 /__problems/400.json;
    error_page 405 /__problems/405.json;
    error_page 413 /__problems/413.json;
    error_page 502 503 504 /__problems/503.json;

    location ^~ /__problems/ {
      internal;
      root /usr/share/nginx;
      default_type application/problem+json;
      types { }
      add_header Retry-After 5 always;
      add_header Allow $allow_methods always;
    }

    location / {
      set $backend backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $correlation_id;
      proxy_pass http://$backend$request_uri;
    }

  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8193; frame-src http://localhost:8193; form-action 'self' http://localhost:8193; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 413 /__problems/413.json;
    error_page 502 503 504 /__problems/503.json;

    location ^~ /__problems/ {
      internal;
      root /usr/share/nginx;
      default_type application/problem+json;
      types { }
    }

    location /v1/ {
      set $backend backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $correlation_id;
      proxy_pass http://$backend$request_uri;
    }

    location /assets/ {
      expires 7d;
      try_files $uri =404;
    }

    location / {
      try_files $uri /index.html;
    }

  }
}
