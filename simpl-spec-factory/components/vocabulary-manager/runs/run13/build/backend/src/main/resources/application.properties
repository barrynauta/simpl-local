# Vocabulary Manager backend. Every value can be set from the environment (MACH-07, E4).
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.max-http-request-header-size=32KB
server.tomcat.max-swallow-size=8MB
server.tomcat.max-part-count=100
server.tomcat.max-parameter-count=10000
server.tomcat.max-http-form-post-size=7MB
server.tomcat.reject-illegal-header=true
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
spring.application.name=vocabulary-manager-be
spring.main.banner-mode=off
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true
# D15, D76: 5 MB per part, 6 MB per request. Above it the API answers 413.
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=6291456B
spring.servlet.multipart.file-size-threshold=1MB
spring.mvc.problemdetails.enabled=false
vm.content-base-url=${VOCABULARY_CONTENT_BASE_URL:https://authority.example/vocabulary-manager}
vm.store.query-url=${STORE_QUERY_URL:http://localhost:3030/vocabulary/query}
vm.store.update-url=${STORE_UPDATE_URL:http://localhost:3030/vocabulary/update}
vm.store.read-user=${STORE_READ_USER:reader}
vm.store.read-password=${STORE_READ_PASSWORD:}
vm.store.update-user=${STORE_UPDATE_USER:writer}
vm.store.update-password=${STORE_UPDATE_PASSWORD:}
vm.store.connect-timeout=${STORE_CONNECT_TIMEOUT:2s}
vm.store.read-timeout=${STORE_READ_TIMEOUT:10s}
vm.store.update-timeout=${STORE_UPDATE_TIMEOUT:45s}
vm.store.health-timeout=${STORE_HEALTH_TIMEOUT:2s}
vm.identity.issuer=${ISSUER_URI:http://localhost:8180/realms/simpl}
vm.identity.audience=${TOKEN_AUDIENCE:vocabulary-manager-be}
vm.identity.jwks-uri=${JWKS_URI:http://localhost:8180/realms/simpl/protocol/openid-connect/certs}
vm.identity.fetch-timeout=${JWKS_FETCH_TIMEOUT:2s}
vm.identity.refetch-cooldown=${JWKS_REFETCH_COOLDOWN:10s}
vm.limits.max-parallel-uploads=${MAX_PARALLEL_UPLOADS:4}
vm.limits.max-write-attempts=${MAX_WRITE_ATTEMPTS:6}
vm.limits.write-budget=${WRITE_BUDGET:30s}
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.defaults.enabled=false
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.structured.format.console=logstash
logging.level.root=INFO
logging.level.org.apache.jena=WARN
logging.level.org.apache.jena.riot=ERROR
