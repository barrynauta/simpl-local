# Vocabulary Manager local stack (build profile run 13). Start with ./stack.sh up (creates .env, D131).
# Host ports: API 8196 and UI 4433 (proxy), Keycloak 127.0.0.1:8193 (D98), store-down backend 8199.
# The store publishes no host port (D83, D107). Resource limits are variables (D98).
name: vm-factory-run13

x-backend-env: &backend-env
  VOCABULARY_CONTENT_BASE_URL: ${VOCABULARY_CONTENT_BASE_URL:-https://authority.example/vocabulary-manager}
  STORE_QUERY_URL: http://fuseki:3030/vocabulary/query
  STORE_UPDATE_URL: http://fuseki:3030/vocabulary/update
  STORE_READ_USER: reader
  STORE_READ_PASSWORD: ${FUSEKI_READ_PASSWORD:?run ./stack.sh up to create .env}
  STORE_UPDATE_USER: writer
  STORE_UPDATE_PASSWORD: ${FUSEKI_UPDATE_PASSWORD:?run ./stack.sh up to create .env}
  ISSUER_URI: ${ISSUER_URI:-http://localhost:8193/realms/simpl}
  JWKS_URI: http://keycloak:8080/realms/simpl/protocol/openid-connect/certs
  TOKEN_AUDIENCE: vocabulary-manager-be
  MAX_PARALLEL_UPLOADS: ${MAX_PARALLEL_UPLOADS:-4}

services:
  fuseki:
    build:
      context: ./fuseki
    image: vm-factory-run13-fuseki:6.2.0
    environment:
      FUSEKI_READ_PASSWORD: ${FUSEKI_READ_PASSWORD}
      FUSEKI_UPDATE_PASSWORD: ${FUSEKI_UPDATE_PASSWORD}
      FUSEKI_ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD}
      JAVA_OPTS: "-Xmx${FUSEKI_HEAP:-1g}"
    volumes:
      - fuseki-data:/fuseki/databases
    networks: [store]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://admin:$${FUSEKI_ADMIN_PASSWORD}@127.0.0.1:3030/vocabulary/query?query=ASK%7B%7D\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${FUSEKI_CPUS:-2.0}"
          memory: ${FUSEKI_MEMORY:-2g}
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8193
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      - ./keycloak/realm-simpl.json:/opt/keycloak/data/import/realm-simpl.json:ro
      - ./keycloak/realm-simpl-other.json:/opt/keycloak/data/import/realm-simpl-other.json:ro
    ports:
      - "127.0.0.1:8193:8080"
    networks: [front]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${KEYCLOAK_CPUS:-2.0}"
          memory: ${KEYCLOAK_MEMORY:-1g}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: vm-factory-run13-backend:1.0.0
    environment: *backend-env
    networks: [store, front]
    depends_on:
      fuseki:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    stop_grace_period: 40s
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-1.5}"
          memory: ${BACKEND_MEMORY:-1g}
    restart: unless-stopped

  proxy:
    build:
      context: ./ui
    image: vm-factory-run13-ui:1.0.0
    environment:
      KEYCLOAK_URL: http://localhost:8193
      KEYCLOAK_REALM: simpl
      KEYCLOAK_CLIENT_ID: vocabulary-manager-ui
    ports:
      - "8196:8081"
      - "4433:8080"
    networks: [front]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPUS:-0.5}"
          memory: ${PROXY_MEMORY:-128m}
    restart: unless-stopped

  # Second backend whose store is unreachable (D44 tests): ./stack.sh store-down-up
  backend-store-down:
    profiles: [store-down]
    image: vm-factory-run13-backend:1.0.0
    environment:
      <<: *backend-env
      STORE_QUERY_URL: http://fuseki:3999/vocabulary/query
      STORE_UPDATE_URL: http://fuseki:3999/vocabulary/update
    ports:
      - "8199:8080"
    networks: [store, front]
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-1.5}"
          memory: ${BACKEND_MEMORY:-1g}

networks:
  store:
    internal: true
  front: {}

volumes:
  fuseki-data: {}
