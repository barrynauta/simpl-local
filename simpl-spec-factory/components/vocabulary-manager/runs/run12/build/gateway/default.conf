# API gateway of the local stack: host port 8196 -> backend replicas (D102, D122, D155, D158).
# Every path goes to the service, so unknown paths get 401 or 404 from it. Answers nginx gives itself
# are problem+json through named locations, which no client can reach.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 7m;
    client_body_buffer_size 1m;
    large_client_header_buffers 8 32k;
    resolver 127.0.0.11 valid=10s ipv6=off;

    error_page 400 = @p400;
    error_page 405 = @p405;
    error_page 413 = @p413;
    error_page 414 = @p414;
    error_page 431 494 = @p431;
    error_page 502 503 504 = @p503;

    location / {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    location @p400 {
        default_type application/problem+json;
        return 400 '{"type":"urn:problem-type:belgif:badRequest","href":"https://www.belgif.be/specification/rest/api-guide/problems/badRequest.html","title":"Bad Request","status":400,"detail":"The request is malformed."}';
    }
    location @p405 {
        default_type application/problem+json;
        add_header Allow "GET, POST, PATCH, DELETE" always;
        return 405 '{"type":"urn:problem-type:simpl:methodNotAllowed","title":"Method Not Allowed","status":405,"detail":"The method is not allowed for this resource."}';
    }
    location @p413 {
        default_type application/problem+json;
        return 413 '{"type":"urn:problem-type:simpl:payloadTooLarge","title":"Payload Too Large","status":413,"detail":"Uploaded vocabulary file is too large. The maximum allowed upload size is 5 MB. Please upload a smaller Turtle file."}';
    }
    location @p414 {
        default_type application/problem+json;
        return 414 '{"type":"urn:problem-type:simpl:uriTooLong","title":"URI Too Long","status":414,"detail":"The request URL is too long."}';
    }
    location @p431 {
        default_type application/problem+json;
        return 431 '{"type":"urn:problem-type:simpl:requestHeaderFieldsTooLarge","title":"Request Header Fields Too Large","status":431,"detail":"The request headers are too large."}';
    }
    location @p503 {
        default_type application/problem+json;
        add_header Retry-After "5" always;
        return 503 '{"type":"urn:problem-type:belgif:serviceUnavailable","href":"https://www.belgif.be/specification/rest/api-guide/problems/serviceUnavailable.html","title":"Service Unavailable","status":503,"detail":"The vocabulary service is not available. Retry later."}';
    }
}

# Health of the gateway itself, on a port that is not published.
server {
    listen 8081;
    server_tokens off;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
