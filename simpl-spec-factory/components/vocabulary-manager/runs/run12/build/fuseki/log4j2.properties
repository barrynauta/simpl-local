# Fuseki logging (D80): the per-request action log would print SPARQL text, which carries creator
# e-mail addresses, so it is limited to warnings. Server start and errors stay visible.
status = error
name = FusekiLogging
appender.console.type = Console
appender.console.name = OUT
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] %-10c{1} %-5p %m%n
rootLogger.level = WARN
rootLogger.appenderRef.stdout.ref = OUT
logger.server.name = org.apache.jena.fuseki.Server
logger.server.level = INFO
logger.config.name = org.apache.jena.fuseki.Config
logger.config.level = INFO
logger.action.name = org.apache.jena.fuseki.Fuseki
logger.action.level = WARN
logger.request.name = org.apache.jena.fuseki.Request
logger.request.level = WARN
logger.jetty.name = org.eclipse.jetty
logger.jetty.level = WARN
logger.shiro.name = org.apache.shiro
logger.shiro.level = WARN
