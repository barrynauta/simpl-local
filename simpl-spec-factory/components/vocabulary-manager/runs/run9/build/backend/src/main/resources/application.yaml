spring:
  application:
    name: vocabulary-manager
  main:
    banner-mode: off
  servlet:
    multipart:
      enabled: false
  web:
    resources:
      add-mappings: false
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 16MB
    max-http-form-post-size: 7MB
    threads:
      max: 64
  servlet:
    encoding:
      force: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:0.0.0.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    propagation:
      type: w3c
  metrics:
    tags:
      application: vocabulary-manager

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
  level:
    root: INFO
    org.apache.jena: WARN

vm:
  content-base-url: ${VOCABULARY_CONTENT_BASE_URL:https://authority.example/vocabulary-manager}
  store:
    query-url: ${STORE_QUERY_URL:http://localhost:3030/vocabulary/query}
    update-url: ${STORE_UPDATE_URL:http://localhost:3030/vocabulary/update}
    read-user: ${STORE_READ_USER:vmread}
    read-password: ${STORE_READ_PASSWORD}
    update-user: ${STORE_UPDATE_USER:vmupdate}
    update-password: ${STORE_UPDATE_PASSWORD}
    connect-timeout: 2s
    read-timeout: 10s
    update-timeout: 45s
    health-timeout: 2s
    write-budget: 30s
  identity:
    issuer-uri: ${ISSUER_URI:http://localhost:8193/realms/simpl}
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8193/realms/simpl/protocol/openid-connect/certs}
    audience: ${TOKEN_AUDIENCE:vocabulary-manager-be}
    fetch-timeout: 2s
    refetch-interval: 10s
  limits:
    max-file-bytes: 5242880
    max-request-bytes: 6291456
    max-json-bytes: 1048576
    max-concurrent-uploads: 4
    upload-permit-wait: 1s
