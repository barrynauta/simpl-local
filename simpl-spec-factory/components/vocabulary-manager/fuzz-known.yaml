     reason: "unknown form parts and JSON properties are rejected, also a part with an empty name (D70)"}
  - {operation: "*", check: ST202, detail_contains: "'aliasUris' must", decision: D38,
     reason: "each search array has at least 1 entry when present; at most 100 URIs in total"}
  - {operation: "*", check: ST202, detail_contains: "'namespaceUris' must", decision: D38,
     reason: "each search array has at least 1 entry when present; at most 100 URIs in total"}
  - {operation: "*", check: ST202, detail_contains: "'changelog'", decision: D37,
     reason: "changelog 1 to 1000 characters after trimming"}
  - {operation: "*", check: ST202, detail_contains: "'description'", decision: D37,
     reason: "description 1 to 1000 characters after trimming"}
  - {operation: "*", check: ST202, detail_contains: "Field 'name'", decision: D37,
     reason: "name 3 to 64 characters, pattern ^[A-Z][a-zA-Z0-9]*$"}
